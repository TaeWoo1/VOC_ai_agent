# SellerOps AI — local / pilot stack.
# Brings up PostgreSQL + Spring Boot backend + Agent Runtime HTTP service + React/Vite frontend.
#
#   cp .env.example .env   # then `docker compose up --build`
#
# The Agent Runtime boots in production mode against the backend-owned run store (fail-closed if
# that store is not configured), which is the pilot posture; override AGENT_RUNTIME_APP_ENV /
# AGENT_RUNTIME_RUNSTORE_KIND for a local file-store dev run. It holds no DB and no channel
# credential — it only forwards the operator's bearer to the backend.
#
# The existing Python review-ops app is NOT part of this stack and is untouched.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sellerops}
      POSTGRES_USER: ${POSTGRES_USER:-sellerops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sellerops_local_pw}
    ports:
      - "5432:5432"
    volumes:
      - sellerops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sellerops} -d ${POSTGRES_DB:-sellerops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sellerops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sellerops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sellerops_local_pw}
      SELLEROPS_JWT_SECRET: ${SELLEROPS_JWT_SECRET:-change-me-local-dev-only-please-use-a-long-random-string}
      SELLEROPS_JWT_EXP_MINUTES: ${SELLEROPS_JWT_EXP_MINUTES:-720}
      # Forward-only schema. `false` (the shipped default) means a non-empty database with no Flyway
      # history FAILS the boot instead of being assumed current — the shape a partial restore leaves.
      # Reachable by name only so an existing pre-Flyway database can be adopted deliberately.
      SELLEROPS_FLYWAY_BASELINE_ON_MIGRATE: ${SELLEROPS_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SELLEROPS_CORS_ORIGIN: ${SELLEROPS_CORS_ORIGIN:-http://localhost:5173}
      # Social sign-in (Google OIDC · NAVER OAuth2) — docs/auth_growth_instrumentation_v1.md.
      # These are the SELLER'S LOGIN, and have nothing to do with the NAVER COMMERCE connector
      # (SELLEROPS_CONNECTOR_NAVER_*) that reads the store's reviews and inquiries: different
      # console, different credential, different callback. A provider without BOTH id and secret
      # does not exist — no bean, no /oauth2 endpoint, no button — so blank is a posture, not a
      # broken config. Without these NAMES here the container cannot see them however carefully
      # an operator writes them into the host env file (same defect class as the AI capabilities
      # below, Pilot Runtime Foundation v1 §3).
      SELLEROPS_OAUTH_GOOGLE_CLIENT_ID: ${SELLEROPS_OAUTH_GOOGLE_CLIENT_ID:-}
      SELLEROPS_OAUTH_GOOGLE_CLIENT_SECRET: ${SELLEROPS_OAUTH_GOOGLE_CLIENT_SECRET:-}
      SELLEROPS_OAUTH_NAVER_CLIENT_ID: ${SELLEROPS_OAUTH_NAVER_CLIENT_ID:-}
      SELLEROPS_OAUTH_NAVER_CLIENT_SECRET: ${SELLEROPS_OAUTH_NAVER_CLIENT_SECRET:-}
      # Pilot Runtime Foundation v1 §3 — the environment contract reaches the container.
      # Every one of these is a NAME here and a value only in the operator's own .env; the
      # defaults below are the safe posture (fixture off, every connector off), so a stack
      # brought up from .env.example runs and connects nothing.
      SELLEROPS_SEED_ENABLED: ${SELLEROPS_SEED_ENABLED:-false}
      SELLEROPS_SEED_DEMO_CONTENT: ${SELLEROPS_SEED_DEMO_CONTENT:-false}
      SELLEROPS_SEED_DEMO_ENTRY: ${SELLEROPS_SEED_DEMO_ENTRY:-}
      SELLEROPS_VAULT_MASTER_KEY: ${SELLEROPS_VAULT_MASTER_KEY:-}
      SELLEROPS_VAULT_KEY_ID: ${SELLEROPS_VAULT_KEY_ID:-}
      # The retired keys a rotation still has to open rows with. CredentialVault and VaultKeyRing
      # support rotation fully; without this name reaching the container, a deployed host cannot
      # perform one — every row sealed by the old key reads KEY_MISMATCH the moment the id changes.
      SELLEROPS_VAULT_KEY_RING: ${SELLEROPS_VAULT_KEY_RING:-}
      # Password reset delivery. Default off (the link is not sent and not logged). `dev-outbox`
      # writes the whole message to the log and deploy.sh refuses it on a pilot host.
      SELLEROPS_MAIL_MODE: ${SELLEROPS_MAIL_MODE:-off}
      SELLEROPS_CONNECTOR_MOCK_ENABLED: ${SELLEROPS_CONNECTOR_MOCK_ENABLED:-false}
      SELLEROPS_CONNECTOR_MOCK_FALLBACK_ENABLED: ${SELLEROPS_CONNECTOR_MOCK_FALLBACK_ENABLED:-false}
      SELLEROPS_CONNECTOR_NAVER_ENABLED: ${SELLEROPS_CONNECTOR_NAVER_ENABLED:-false}
      SELLEROPS_CONNECTOR_NAVER_ADVERTISED_EGRESS_IPS: ${SELLEROPS_CONNECTOR_NAVER_ADVERTISED_EGRESS_IPS:-}
      # The two NAVER 문의 lanes have their OWN flags — turning the connector on does not turn them on,
      # and without these names a deployed host cannot reach them however the operator writes its env file.
      # They are separate contracts (상품 문의 PUT vs 고객 문의 POST, non-overlapping identifier spaces), which
      # is why there are two switches and not one.
      SELLEROPS_CONNECTOR_NAVER_INQUIRY_PRODUCT_QNA_ENABLED: ${SELLEROPS_CONNECTOR_NAVER_INQUIRY_PRODUCT_QNA_ENABLED:-false}
      SELLEROPS_CONNECTOR_NAVER_INQUIRY_CUSTOMER_ENABLED: ${SELLEROPS_CONNECTOR_NAVER_INQUIRY_CUSTOMER_ENABLED:-false}
      SELLEROPS_CONNECTOR_COUPANG_ENABLED: ${SELLEROPS_CONNECTOR_COUPANG_ENABLED:-false}
      SELLEROPS_CONNECTOR_COUPANG_LIVE_APPROVAL_ID: ${SELLEROPS_CONNECTOR_COUPANG_LIVE_APPROVAL_ID:-}
      # The operator id Coupang requires on an answer. Blank and the adapter refuses to send rather than
      # inventing one, so this name is a precondition of the Coupang answer lane, not a tuning knob.
      SELLEROPS_CONNECTOR_COUPANG_REPLY_BY: ${SELLEROPS_CONNECTOR_COUPANG_REPLY_BY:-}
      SELLEROPS_CONNECTOR_CAFE24_ENABLED: ${SELLEROPS_CONNECTOR_CAFE24_ENABLED:-false}
      SELLEROPS_CONNECTOR_CAFE24_CLIENT_ID: ${SELLEROPS_CONNECTOR_CAFE24_CLIENT_ID:-}
      SELLEROPS_CONNECTOR_CAFE24_CLIENT_SECRET: ${SELLEROPS_CONNECTOR_CAFE24_CLIENT_SECRET:-}
      SELLEROPS_CONNECTOR_CAFE24_API_VERSION: ${SELLEROPS_CONNECTOR_CAFE24_API_VERSION:-}
      SELLEROPS_CONNECTOR_CAFE24_REDIRECT_URI: ${SELLEROPS_CONNECTOR_CAFE24_REDIRECT_URI:-}
      SELLEROPS_CONNECTOR_CAFE24_RESULT_URL: ${SELLEROPS_CONNECTOR_CAFE24_RESULT_URL:-}
      # The scope the seller re-consents to before an answer may be written (`mall.write_community`). Without
      # this name a deployed host cannot configure that re-consent, which is the precondition of the one
      # marketplace WRITE lane this repository has verified live (Cafe24 inquiry answer, 2026-08-25). Blank
      # keeps the connection read-only, exactly as before. The read scope keeps its own default in
      # application.yml — restating that literal here would make a second place to change it.
      SELLEROPS_CONNECTOR_CAFE24_ANSWER_EXECUTION_SCOPES: ${SELLEROPS_CONNECTOR_CAFE24_ANSWER_EXECUTION_SCOPES:-}
      # ── Agent AI capabilities (Pilot Readiness Closure v1 §3) ────────────────────────────────
      # Without these names here the backend container cannot SEE them however carefully an operator
      # writes them into the host's env file, so the /agent lane is off on every deployed host and
      # nothing says why. Each stays off by its own flag; the access scope decides WHO, once.
      SELLEROPS_AGENT_ACCESS_SCOPE: ${SELLEROPS_AGENT_ACCESS_SCOPE:-ALLOW_LIST}
      SELLEROPS_AGENT_PLAN_ENABLED: ${SELLEROPS_AGENT_PLAN_ENABLED:-false}
      SELLEROPS_AGENT_PLAN_API_KEY: ${SELLEROPS_AGENT_PLAN_API_KEY:-}
      SELLEROPS_AGENT_PLAN_ORG_IDS: ${SELLEROPS_AGENT_PLAN_ORG_IDS:-}
      SELLEROPS_AGENT_DRAFT_ENABLED: ${SELLEROPS_AGENT_DRAFT_ENABLED:-false}
      SELLEROPS_AGENT_DRAFT_API_KEY: ${SELLEROPS_AGENT_DRAFT_API_KEY:-}
      SELLEROPS_AGENT_DRAFT_ORG_IDS: ${SELLEROPS_AGENT_DRAFT_ORG_IDS:-}
      SELLEROPS_AGENT_JUDGE_ENABLED: ${SELLEROPS_AGENT_JUDGE_ENABLED:-false}
      SELLEROPS_AGENT_JUDGE_API_KEY: ${SELLEROPS_AGENT_JUDGE_API_KEY:-}
      SELLEROPS_AGENT_JUDGE_ORG_IDS: ${SELLEROPS_AGENT_JUDGE_ORG_IDS:-}
      SELLEROPS_AGENT_CONVERSE_ENABLED: ${SELLEROPS_AGENT_CONVERSE_ENABLED:-false}
      SELLEROPS_AGENT_CONVERSE_API_KEY: ${SELLEROPS_AGENT_CONVERSE_API_KEY:-}
      SELLEROPS_AGENT_CONVERSE_ORG_IDS: ${SELLEROPS_AGENT_CONVERSE_ORG_IDS:-}
      SELLEROPS_AGENT_REPORT_ENABLED: ${SELLEROPS_AGENT_REPORT_ENABLED:-false}
      SELLEROPS_AGENT_REPORT_API_KEY: ${SELLEROPS_AGENT_REPORT_API_KEY:-}
      SELLEROPS_AGENT_REPORT_ORG_IDS: ${SELLEROPS_AGENT_REPORT_ORG_IDS:-}
      SELLEROPS_KNOWLEDGE_EMBEDDING_ENABLED: ${SELLEROPS_KNOWLEDGE_EMBEDDING_ENABLED:-false}
      SELLEROPS_KNOWLEDGE_EMBEDDING_API_KEY: ${SELLEROPS_KNOWLEDGE_EMBEDDING_API_KEY:-}
      SELLEROPS_KNOWLEDGE_EMBEDDING_ORG_IDS: ${SELLEROPS_KNOWLEDGE_EMBEDDING_ORG_IDS:-}
      SELLEROPS_KNOWLEDGE_INTENT_ENABLED: ${SELLEROPS_KNOWLEDGE_INTENT_ENABLED:-false}
      SELLEROPS_KNOWLEDGE_INTENT_API_KEY: ${SELLEROPS_KNOWLEDGE_INTENT_API_KEY:-}
      SELLEROPS_KNOWLEDGE_INTENT_ORG_IDS: ${SELLEROPS_KNOWLEDGE_INTENT_ORG_IDS:-}
      SELLEROPS_KNOWLEDGE_ELIGIBILITY_ENABLED: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_ENABLED:-false}
      SELLEROPS_KNOWLEDGE_ELIGIBILITY_API_KEY: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_API_KEY:-}
      SELLEROPS_KNOWLEDGE_ELIGIBILITY_ORG_IDS: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_ORG_IDS:-}
      SELLEROPS_REVIEW_MEDIA_VISION_ENABLED: ${SELLEROPS_REVIEW_MEDIA_VISION_ENABLED:-false}
      SELLEROPS_REVIEW_MEDIA_VISION_API_KEY: ${SELLEROPS_REVIEW_MEDIA_VISION_API_KEY:-}
      SELLEROPS_REVIEW_MEDIA_VISION_ORG_IDS: ${SELLEROPS_REVIEW_MEDIA_VISION_ORG_IDS:-}
      SELLEROPS_KNOWLEDGE_BOOTSTRAP_AUTO_ENABLED: ${SELLEROPS_KNOWLEDGE_BOOTSTRAP_AUTO_ENABLED:-false}
      SELLEROPS_SELF_PILOT_ENABLED: ${SELLEROPS_SELF_PILOT_ENABLED:-false}
      SELLEROPS_SELF_PILOT_SCOPE: ${SELLEROPS_SELF_PILOT_SCOPE:-ALLOW_LIST}
      SELLEROPS_SELF_PILOT_ORG_IDS: ${SELLEROPS_SELF_PILOT_ORG_IDS:-}
      SELLEROPS_SELF_PILOT_READ_GRANT_ID: ${SELLEROPS_SELF_PILOT_READ_GRANT_ID:-}
      SELLEROPS_SELF_PILOT_DEFAULT_INTERVAL_MINUTES: ${SELLEROPS_SELF_PILOT_DEFAULT_INTERVAL_MINUTES:-60}
      # Self-pilot CREATES the schedules; this poller is what EXECUTES them. Without this name a deployed host
      # can turn self-pilot on, watch schedules appear, and never collect anything — the two halves of routine
      # collection were not reachable from the same env file.
      SELLEROPS_COLLECT_SCHEDULER_ENABLED: ${SELLEROPS_COLLECT_SCHEDULER_ENABLED:-false}
      SELLEROPS_PROACTIVE_ENABLED: ${SELLEROPS_PROACTIVE_ENABLED:-false}
      SELLEROPS_PROACTIVE_ORG_IDS: ${SELLEROPS_PROACTIVE_ORG_IDS:-}
      SELLEROPS_RESPONSIBILITY_SCHEDULER_ENABLED: ${SELLEROPS_RESPONSIBILITY_SCHEDULER_ENABLED:-false}
      RESPONSIBILITY_RUNTIME_ORG_IDS: ${RESPONSIBILITY_RUNTIME_ORG_IDS:-}
      SELLEROPS_RESPONSIBILITY_INVESTIGATION_ENABLED: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_ENABLED:-false}
      SELLEROPS_RESPONSIBILITY_INVESTIGATION_ORG_IDS: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_ORG_IDS:-}
      SELLEROPS_RESPONSIBILITY_INVESTIGATION_API_KEY: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_API_KEY:-}
      SELLEROPS_INQUIRY_PUBLISH_EXECUTION_ENABLED: ${SELLEROPS_INQUIRY_PUBLISH_EXECUTION_ENABLED:-false}
      SELLEROPS_INQUIRY_PUBLISH_NAVER_LIVE_APPROVAL_ID: ${SELLEROPS_INQUIRY_PUBLISH_NAVER_LIVE_APPROVAL_ID:-}
      SELLEROPS_INQUIRY_PUBLISH_CAFE24_LIVE_APPROVAL_ID: ${SELLEROPS_INQUIRY_PUBLISH_CAFE24_LIVE_APPROVAL_ID:-}
      SELLEROPS_INQUIRY_PUBLISH_CAFE24_CLIENT_IP: ${SELLEROPS_INQUIRY_PUBLISH_CAFE24_CLIENT_IP:-}
      SELLEROPS_INQUIRY_PUBLISH_CAFE24_SHOP_NO: ${SELLEROPS_INQUIRY_PUBLISH_CAFE24_SHOP_NO:-0}
      # Review replies are a SECOND execution lane with its own flag and its own approval id — the inquiry
      # names above do not reach it. Five inquiry names were here and zero review names were, so the Cafe24
      # review comment adapter was unreachable on every deployed host. Off by default, exactly as before.
      SELLEROPS_REVIEW_PUBLISH_EXECUTION_ENABLED: ${SELLEROPS_REVIEW_PUBLISH_EXECUTION_ENABLED:-false}
      SELLEROPS_REVIEW_PUBLISH_CAFE24_LIVE_APPROVAL_ID: ${SELLEROPS_REVIEW_PUBLISH_CAFE24_LIVE_APPROVAL_ID:-}
      # SELLEROPS_REVIEW_PUBLISH_CAFE24_SHOP_NO is deliberately NOT passed through. Its property reads
      # `${SELLEROPS_REVIEW_PUBLISH_CAFE24_SHOP_NO:${SELLEROPS_INQUIRY_PUBLISH_CAFE24_SHOP_NO:0}}` — it inherits
      # the inquiry shop number. Naming it here would hand the backend an explicit value on every host and
      # silently replace that inheritance with 0, so the review lane would aim at no shop while the inquiry
      # lane aimed at the right one. A deployment that genuinely needs a different shop sets it on the host.
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The backend exposes a public /health; gate the runtime on it so a production-mode boot
      # (which fails closed if it cannot reach the backend-owned store) starts against a live backend.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent-runtime:
    build:
      context: ./agent-runtime
    environment:
      # System of record. Server-to-server hop, so no CORS is involved here.
      SELLEROPS_BASE_URL: http://backend:8080
      # Pilot posture: production mode on the backend-owned (spring) run store. Fails closed at boot
      # on a file/memory store when APP_ENV=production — override both for a local file-store dev run.
      APP_ENV: ${AGENT_RUNTIME_APP_ENV:-production}
      AGENT_RUNTIME_RUNSTORE_KIND: ${AGENT_RUNTIME_RUNSTORE_KIND:-spring}
      AGENT_RUNTIME_PORT: "8787"
      # Browser origin allowed to call the runtime (the frontend). Backend hop needs no CORS.
      AGENT_RUNTIME_CORS_ORIGINS: ${AGENT_RUNTIME_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8787:8787"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        # Baked into the bundle at build time, so it is the BROWSER's address for the runtime, not
        # the container's. The default below is the published port on the same machine, which is
        # right for a local stack and wrong for every remote host — set it in .env there, and allow
        # the frontend origin in AGENT_RUNTIME_CORS_ORIGINS.
        VITE_AGENT_RUNTIME_URL: ${VITE_AGENT_RUNTIME_URL:-http://127.0.0.1:8787}
    ports:
      - "5173:80"
    depends_on:
      - backend
      - agent-runtime

volumes:
  sellerops_pgdata:
