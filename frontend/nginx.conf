server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (docs/service_readiness_v1.md §2-5). The CSP itself is a build-time <meta> in index.html
    # (it depends on which vendors the build enabled); frame-ancestors cannot be expressed in a <meta>, so the
    # framing fence is here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # SPA fallback — all client routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
