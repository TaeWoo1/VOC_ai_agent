# Frontend CI — runs the Action Window frontend's typecheck / test / build on PRs so
# the FE-6 (component) and FE-7 (page-level) DOM test safety net is enforced
# automatically, not only locally. Scoped to the self-contained `frontend/` npm package.
name: frontend-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      # The frontend consumes the shared contract, so a contract change can break the FE typecheck/build and
      # must run this check.
      #
      # This was 'contracts/action-window/v1/**' and that was a real hole: the frontend also imports v2
      # (reply/replyRuntime, reply/replyFrameTransport, reply/replyBridge) and aw-carrier-kind.ts
      # (wsTransport, operationsStore) — so a v2 or carrier-kind change could break the frontend with no CI
      # signal at all. Widened to the whole directory rather than enumerating versions, because enumerating
      # them is what went stale the moment v2 was added.
      - 'contracts/**'
      - '.github/workflows/frontend-ci.yml'

# One run per PR ref; cancel superseded runs when new commits are pushed.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — the job only reads the checkout.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
