plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sellerops'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Social login (Google OIDC · NAVER OAuth2) on top of the existing JWT — docs/auth_growth_instrumentation_v1.md
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // Service Readiness v1 (docs/service_readiness_v1.md): error monitoring (OFF without SENTRY_DSN) and the
    // password-reset mailer (OFF without SELLEROPS_MAIL_MODE).
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.53.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // File ingestion: CSV (Commons CSV) + XLSX (Apache POI)
    implementation 'org.apache.commons:commons-csv:1.11.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    runtimeOnly 'org.postgresql:postgresql'

    // JWT (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Release identity for Sentry only (docs/service_readiness_v1.md §2-7): the short git SHA at build time lands in
// META-INF/build-info.properties as `build.git`; SELLEROPS_RELEASE overrides it at run time. Never shown to a seller.
def gitShortSha = {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
            workingDir projectDir
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def sha = out.toString().trim()
        sha ? sha : 'unknown'
    } catch (Exception ignored) {
        'unknown'
    }
}()

springBoot {
    buildInfo {
        properties {
            additional = [git: gitShortSha]
        }
    }
}
