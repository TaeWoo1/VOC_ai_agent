plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sellerops'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Social login (Google OIDC · NAVER OAuth2) on top of the existing JWT — docs/auth_growth_instrumentation_v1.md
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // Service Readiness v1 (docs/service_readiness_v1.md): error monitoring (OFF without SENTRY_DSN) and the
    // password-reset mailer (OFF without SELLEROPS_MAIL_MODE).
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.53.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Channel Knowledge packs ship as versioned YAML resources reviewed beside the code they describe
    // (docs/demo_org_and_channel_knowledge_v1.md). Spring Boot manages the version.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    // File ingestion: CSV (Commons CSV) + XLSX (Apache POI)
    implementation 'org.apache.commons:commons-csv:1.11.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    runtimeOnly 'org.postgresql:postgresql'

    // JWT (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Release identity for Sentry only (docs/service_readiness_v1.md §2-7): the short git SHA at build time lands in
// META-INF/build-info.properties as `build.git`; SELLEROPS_RELEASE overrides it at run time. Never shown to a seller.
def gitShortSha = {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
            workingDir projectDir
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def sha = out.toString().trim()
        sha ? sha : 'unknown'
    } catch (Exception ignored) {
        'unknown'
    }
}()

springBoot {
    buildInfo {
        properties {
            additional = [git: gitShortSha]
        }
    }
}

// Inquiry v3.5 §23.10 — the Customer Goal Interpreter smoke, as ONE operator command.
//
//   SELLEROPS_INQUIRY_GOAL_API_KEY='...' SELLEROPS_INQUIRY_GOAL_ENDPOINT='https://...' \
//     ./gradlew -p backend runGoalSmoke --args='--approval <manifest> \
//       --granted-approval apr-... --granted-run <run-id> --out <a new directory>'
//
// It runs on the TEST runtime classpath deliberately: the interpreter has no production caller, and a task pointed
// at a main-tree entrypoint would quietly make that untrue. The task implements no approval semantics of its own —
// it starts a JVM and hands it the process environment. Every authorization decision belongs to CustomerGoalRunner
// and GoalRunGuard, so there is exactly one place to get it wrong.
//
// `--no-daemon` is in the documented command because a reused daemon can answer System.getenv() with the
// environment it was STARTED with, and a credential that silently does not arrive looks identical to one that is
// wrong. GoalSmokeRehearsalTest measures this rather than trusting it.
tasks.register('runGoalSmoke', JavaExec) {
    group = 'verification'
    description = 'Run the Inquiry v3.5 Customer Goal Interpreter smoke against an approved manifest.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sellerops.inquiry.goal.GoalRunLauncher'
    // The launcher resolves the repository root relative to this directory, so a run is attributable to this
    // worktree's git and not to whatever directory the operator happened to be standing in.
    workingDir = projectDir
}

// Inquiry v3.5 §24.1 — the PREPARE half of the same command pair. Writes PREFLIGHT.json always and APPROVAL.json
// only when the verdict is ready, so a blocked preflight never leaves something that looks bindable beside it.
//
//   SELLEROPS_INQUIRY_GOAL_API_KEY='...' SELLEROPS_INQUIRY_GOAL_ENDPOINT='https://...' \
//     ./gradlew --no-daemon -q --offline prepareGoalSmoke --args='--out <a new directory>'
//
// Zero vendor calls: this is what decides whether transport WOULD work, without doing any.
tasks.register('prepareGoalSmoke', JavaExec) {
    group = 'verification'
    description = 'Prepare (and write) an Approval Manifest for the Inquiry v3.5 Customer Goal Interpreter smoke.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sellerops.inquiry.goal.GoalInterpreterPreflight'
    workingDir = projectDir
}
