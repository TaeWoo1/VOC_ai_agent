spring:
  application:
    name: sellerops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sellerops}
    username: ${SPRING_DATASOURCE_USERNAME:sellerops}
    password: ${SPRING_DATASOURCE_PASSWORD:sellerops_local_pw}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate neither creates nor validates it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    # Forward-only, and a non-empty schema with no history is a REFUSAL, not a baseline.
    #
    # `baseline-on-migrate: true` says: if this database already has tables but no flyway history,
    # assume everything up to now was applied and start from here. On an empty database that is a
    # no-op; on a hand-built or half-restored one it SKIPS every earlier migration and then reports
    # success — the schema is wrong and nothing says so. That is exactly the database a pilot host
    # can end up with after a partial restore, so the default is now `false` and a boot against such
    # a schema fails loudly with the version it expected.
    #
    # It stays overridable by name for the one case that legitimately needs it: adopting an existing
    # database whose history genuinely predates Flyway. `deploy/pilot/deploy.sh` refuses `true`.
    baseline-on-migrate: ${SELLEROPS_FLYWAY_BASELINE_ON_MIGRATE:false}
    # Both are Flyway defaults; they are written down because they are the properties the schema's
    # safety rests on. `validate-on-migrate` catches an edited migration (checksum drift) before it
    # runs; `out-of-order: false` is why a reused version number — V29, V35 — fails the deploy
    # (MigrationContractTest keeps them burned so it fails in CI instead).
    validate-on-migrate: true
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

sellerops:
  # The Local Agent credential handoff — the ONE path that reads a seller's API keys off their marketplace
  # screen and writes them into the vault. Armed separately from the read-only live-call interlock above,
  # with the WHOLE identity the operator's grant was bound to, and spent after one store.
  #
  # Empty by default, which means UNARMED: a handoff on an unprepared backend is refused before the vault is
  # touched. Armed only by tools/coupang-local/wing-credential-arm-backend.sh, from the run env that
  # wing-credential-bootstrap.sh minted — every field must have the shape that bootstrap produces, so a
  # hand-exported value is a refusal rather than a shortcut. All four are environment tokens, never secrets.
  credential-handoff:
    approval-id: ${SELLEROPS_CREDENTIAL_HANDOFF_APPROVAL_ID:}
    run-id: ${SELLEROPS_CREDENTIAL_HANDOFF_RUN_ID:}
    git-commit: ${SELLEROPS_CREDENTIAL_HANDOFF_GIT_COMMIT:}
    # Must be COUPANG_WING_CREDENTIAL_HANDOFF. The calibration phase mints an identically-shaped approval id
    # for a run that reads NO value; this is what stops its grant from arming the run that reads three.
    phase: ${SELLEROPS_CREDENTIAL_HANDOFF_PHASE:}
    # The bootstrap's own epoch. An arming older than the TTL (1h) is refused — the grant is single-sitting.
    armed-at-epoch-seconds: ${SELLEROPS_CREDENTIAL_HANDOFF_ARMED_AT:0}
  # The LLM triage classifier's conservative production pilot — contracts/review-eval/naver/v2/RUBRIC.md
  # §13.7. OFF by default and opt-in per organisation: an org not listed sees exactly what it saw before
  # the pilot existed. Every request knob is here because all of them are part of the candidate's
  # identity (§8.8); the defaults are frozen candidate C2's, and changing any is running a different
  # candidate. NAVER, Cafe24 and Coupang only (RUBRIC §8.3.1), through ReviewTriageChannelGate; additive 확인 필요 promotion only; no
  # marketplace write. The key is held in memory and never logged, stored, or versioned.
  triage:
    ai-pilot:
      enabled: ${SELLEROPS_AI_TRIAGE_PILOT_ENABLED:false}
      # Comma-separated org UUIDs, or "*" for every org in this backend (local single-user deployment —
      # pair with sellerops.self-pilot.scope=LOCAL_SINGLE_USER; never "*" on a shared multi-tenant backend).
      enabled-org-ids: ${SELLEROPS_AI_TRIAGE_PILOT_ORG_IDS:}
      vendor: ${SELLEROPS_AI_TRIAGE_VENDOR:OPENAI}
      model: ${SELLEROPS_AI_TRIAGE_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_AI_TRIAGE_API_KEY:}
      omit-temperature: ${SELLEROPS_AI_TRIAGE_OMIT_TEMPERATURE:true}
      max-output-tokens: ${SELLEROPS_AI_TRIAGE_MAX_OUTPUT_TOKENS:4000}
      reasoning-effort: ${SELLEROPS_AI_TRIAGE_REASONING_EFFORT:low}
      max-per-run: ${SELLEROPS_AI_TRIAGE_MAX_PER_RUN:100}
  # The Agent Runtime's model seam — the LLM behind the LangGraph inquiry reply-draft node.
  #
  # A SEPARATE switch and a SEPARATE key from the triage pilot above, deliberately: they are different
  # exposures. Triage sends a review's rating and body; this sends an INQUIRY's title and body, which is the
  # content `agent-runtime/src/provider/DraftModelSeam.ts` named as the reason no live model had been wired.
  # A deployment that wants one and not the other must be able to have exactly that.
  #
  # OFF by default and opt-in per organisation. Off, unkeyed, or an org outside the list all mean the same
  # thing — no model draft, and `InquiryDraftComposer` reports the capability as unavailable instead of
  # writing anything. `agent-runtime` never sees this key: every inquiry draft, from the inquiry screen, the
  # chat lane or the legacy /api/agent-runs lanes, goes through POST /api/inquiries/{id}/draft/generate with
  # the operator's own bearer token, so the backend stays the only LLM egress in the repository.
  agent:
    # ── WHO may use the three Agent capabilities (Pilot Readiness Closure v1 §2) ─────────────────
    #
    # Each capability below keeps its own flag, key and org list — they are different exposures and a
    # deployment must be able to run any subset. This property answers the other question ONCE: given a
    # capability this deployment has configured, which organisations are its audience?
    #
    #   ALLOW_LIST (default) — only the org ids written into each capability's `enabled-org-ids`.
    #     Byte-identical to the behaviour before this property existed. Admitting a seller means an env
    #     edit and a restart, which is why it is not the pilot's value.
    #   CONNECTED_SELLERS   — any org that owns a CONNECTED, non-file-upload seller account. A seller
    #     reaches CONNECTED only by finishing an OAuth consent or entering a credential, so this is the
    #     record of who asked, not a guess — the same sentence sellerops.self-pilot.scope uses for
    #     routine collection. No env edit, no restart, and a drive-by signup that connected nothing
    #     spends nothing.
    #   ALL_ORGS            — every org in this backend. The honest name for what a bare "*" meant.
    #
    # The policy only WIDENS, and only the org question: a capability with no flag or no key stays off
    # for everyone under every value, and an org named in a capability's own list stays admitted.
    access:
      scope: ${SELLEROPS_AGENT_ACCESS_SCOPE:ALLOW_LIST}
    # ── The daily ceiling, and the two switches it is (LangGraph/AOP v1 §0, 2026-09-06) ─────────
    #
    # `enabled` decides whether spend is RECORDED; `enforced` decides whether it may REFUSE. They were
    # one switch, and that shape had a defect worth naming: turning the ceiling off to run a benchmark
    # or a manual-QA sitting also turned the METER off, so the sittings that most need usage, latency
    # and cost numbers were the ones that produced none — and a benchmark that raised the limit was
    # measuring the quota rather than the model until someone noticed.
    #
    # Local, manual-QA and benchmark deployments want enforced=false. Production and pilot leave both
    # true, and nothing about their behaviour changed. Enforcement without metering is not offered:
    # a deployment that records nothing has nothing to compare a limit against.
    quota:
      enabled: ${SELLEROPS_AGENT_QUOTA_ENABLED:true}
      enforced: ${SELLEROPS_AGENT_QUOTA_ENFORCED:true}
      # Believe a caller that labels its calls QA / BENCHMARK. Off by default everywhere: where it is
      # off, every call is charged to the seller however it is labelled.
      trust-actor-header: ${SELLEROPS_AGENT_QUOTA_TRUST_ACTOR_HEADER:false}
      daily-runs-per-org: ${SELLEROPS_AGENT_QUOTA_DAILY_RUNS_PER_ORG:200}
      daily-llm-calls-per-org: ${SELLEROPS_AGENT_QUOTA_DAILY_LLM_CALLS_PER_ORG:1000}
    draft:
      enabled: ${SELLEROPS_AGENT_DRAFT_ENABLED:false}
      # Comma-separated org UUIDs, or "*" for every org in this backend (local single-user deployment —
      # pair with sellerops.self-pilot.scope=LOCAL_SINGLE_USER; never "*" on a shared multi-tenant backend).
      enabled-org-ids: ${SELLEROPS_AGENT_DRAFT_ORG_IDS:}
      vendor: ${SELLEROPS_AGENT_DRAFT_VENDOR:OPENAI}
      model: ${SELLEROPS_AGENT_DRAFT_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_AGENT_DRAFT_API_KEY:}
      # On a reasoning model this budget is SHARED with internal reasoning, so a budget sized for a two-sentence
      # reply can be spent before any answer is emitted — arriving as `budget_exhausted` and, correctly but
      # uselessly, a rule-based fallback on every inquiry.
      max-output-tokens: ${SELLEROPS_AGENT_DRAFT_MAX_OUTPUT_TOKENS:4000}
      reasoning-effort: ${SELLEROPS_AGENT_DRAFT_REASONING_EFFORT:low}
    # ── Operator Graph v1 (2026-08-21): goal interpretation and evidence judging ──────────────────
    #
    # TWO MORE separate switches and separate keys, for the reason the draft one is separate from the
    # triage pilot: they are different exposures and a deployment must be able to run any subset.
    #   * plan  sends the OPERATOR'S OWN typed sentence plus a static tool catalogue. No seller row at all.
    #   * judge sends a sentence SellerOps composed plus closed-vocabulary evidence metadata (labels,
    #     counts, coverage verdicts, ISO dates). `EvidenceDigestFloor` refuses the request outright if the
    #     digest is not metadata, so prose cannot leave through it.
    # Neither carries a customer utterance, and both floors are asserted on the serialized request bytes
    # by AgentOperatorPayloadFloorTest.
    #
    # OFF by default, and what "off" MEANS changed in Operator Graph v2:
    #   * plan off  ⇒ Agent chat does NOT degrade to keyword routing. There is no deterministic planner
    #     any more, in product, test or emergency use. A run whose plan cannot be made ends FAILED and
    #     the screen says so. Dashboard shortcuts (button-sent `intent`) keep working normally.
    #   * judge off ⇒ the deterministic rule judge decides, exactly as before. That fallback STAYS: the
    #     rule judge is withhold-only, so losing the model makes the Operator quieter, never bolder.
    # The asymmetry is deliberate — a missing planner would have to INVENT a plan, while a missing judge
    # only has to refuse more.
    # ── Agentic Report v1 (2026-09-04): the operating report's narrative ──────────────────────────
    #
    # The ninth capability and its own switch. What leaves is the report's FACTS snapshot — counts,
    # dates, closed-vocabulary issue titles, the seller's own product names, opportunity labels — and
    # no customer text (AgentReportPayloadFloorTest asserts the bytes). Off ⇒ the deterministic summary
    # is the whole report; a report is never blank and never wrong for lack of this.
    report:
      enabled: ${SELLEROPS_AGENT_REPORT_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_AGENT_REPORT_ORG_IDS:}
      vendor: ${SELLEROPS_AGENT_REPORT_VENDOR:OPENAI}
      model: ${SELLEROPS_AGENT_REPORT_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_AGENT_REPORT_API_KEY:}
      max-output-tokens: ${SELLEROPS_AGENT_REPORT_MAX_OUTPUT_TOKENS:3000}
      reasoning-effort: ${SELLEROPS_AGENT_REPORT_REASONING_EFFORT:low}
    plan:
      enabled: ${SELLEROPS_AGENT_PLAN_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_AGENT_PLAN_ORG_IDS:}
      vendor: ${SELLEROPS_AGENT_PLAN_VENDOR:OPENAI}
      model: ${SELLEROPS_AGENT_PLAN_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_AGENT_PLAN_API_KEY:}
      # 2000 was sized for v1's four-field plan. The v2 InvestigationPlan carries information needs, a
      # retrieval order and evidence requirements, and on a reasoning model the budget is SHARED with
      # internal reasoning — so the answer was cut off before it was emitted. Measured live 2026-08-21:
      # the spec question planned fine and the policy/difference questions both returned
      # `budget_exhausted`, which the runtime correctly reported as a FAILED run rather than guessing.
      max-output-tokens: ${SELLEROPS_AGENT_PLAN_MAX_OUTPUT_TOKENS:6000}
      # `minimal`, not `low` — Agent Responsiveness v1 (2026-09-01), and the change is a MEASUREMENT,
      # not a preference.
      #
      # One plan call is 98–99% of a free-sentence turn (measured: plan 11,274ms of an 11,425ms turn;
      # tools 65ms; judge 12ms), and its duration tracks the tokens it emits. At `low` the planner spent
      # 256–576 tokens per call on internal reasoning before writing a ~340-token answer; at `minimal` it
      # spends 0 and writes the same answer. The same 14-sentence suite, run against the real Demo Org at
      # both settings, moved from a 12.2s median (7.4–26.5s) to a 4.8s median (3.8–8.6s) — and produced
      # the SAME outcome on 13 of 14 sentences, the fourteenth being a capability question the faster
      # setting answered with MORE evidence, not less.
      #
      # This is the planner only. The draft capability above keeps its effort: that model writes the
      # Korean sentence a customer will read, this one fills in closed tokens against a schema, and the
      # two are not the same kind of work. Reversible with one environment variable, which is why the
      # measurement is recorded here rather than in a commit message.
      reasoning-effort: ${SELLEROPS_AGENT_PLAN_REASONING_EFFORT:minimal}
      # What a SECOND attempt at the same goal is given. Reached only when the first plan was refused by
      # the validator or the run asked to re-plan — never chosen from the seller's words. Blank ⇒ the
      # value above, which is how the escalation is turned off without inventing a number.
      retry-reasoning-effort: ${SELLEROPS_AGENT_PLAN_RETRY_REASONING_EFFORT:low}
    judge:
      enabled: ${SELLEROPS_AGENT_JUDGE_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_AGENT_JUDGE_ORG_IDS:}
      vendor: ${SELLEROPS_AGENT_JUDGE_VENDOR:OPENAI}
      model: ${SELLEROPS_AGENT_JUDGE_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_AGENT_JUDGE_API_KEY:}
      max-output-tokens: ${SELLEROPS_AGENT_JUDGE_MAX_OUTPUT_TOKENS:2000}
      reasoning-effort: ${SELLEROPS_AGENT_JUDGE_REASONING_EFFORT:low}
    # ── Grounded Conversation (Grounded Conversation Lane v1, 2026-09-07) ────────────────────────
    #
    # 열 번째 스위치이자 열 번째 키. 나가는 것은 판매자 자신의 문장, 이 스레드에서 우리가 쓴 문장,
    # 그리고 이 배포가 자기 자신에 대해 조립한 사실 목록뿐이다 — 고객 본문은 포함되지 않는다.
    # 꺼져 있으면 결정론 composer가 그대로 답한다(이 패키지 이전과 바이트 동일).
    converse:
      enabled: ${SELLEROPS_AGENT_CONVERSE_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_AGENT_CONVERSE_ORG_IDS:}
      vendor: ${SELLEROPS_AGENT_CONVERSE_VENDOR:OPENAI}
      model: ${SELLEROPS_AGENT_CONVERSE_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_AGENT_CONVERSE_API_KEY:}
      max-output-tokens: ${SELLEROPS_AGENT_CONVERSE_MAX_OUTPUT_TOKENS:2000}
      reasoning-effort: ${SELLEROPS_AGENT_CONVERSE_REASONING_EFFORT:minimal}
    # ── Inquiry semantic signature (Operator Graph v2, 2026-08-21) ───────────────────────────────
    #
    # A FOURTH separate switch and separate key. This is the heaviest of the four exposures: it sends ONE
    # CUSTOMER'S OWN inquiry text and receives two closed-vocabulary labels. It gets its own flag for the
    # reason every other one does — a deployment that wants goal interpretation must not thereby be
    # sending customer questions to a vendor.
    #
    # Bounded three ways: a text is classified AT MOST ONCE ever (content-hash cache — a privacy control
    # before a cost one), a single text is truncated rather than split, and one backfill page classifies at
    # most `max-batch-per-call`. Off ⇒ an inquiry's signature stays null, exactly as it was before v2 —
    # never a default topic, because a default would let a classification gap become a "repeat" a seller
    # is shown (measured: 기타 x 1,777 on real data).
  inquiry:
    publish:
      # The seller-confirmed reply send. Off by default and absent from every deployment that has
      # not deliberately turned it on: with it off NO ChannelReplyAdapter bean is created, the
      # registry resolves empty, and the publish core fails closed. That absence IS the fence.
      execution-enabled: ${SELLEROPS_INQUIRY_PUBLISH_EXECUTION_ENABLED:false}
      naver:
        # The live-run approval id a NAVER answer must be armed with, per
        # docs/sellerops_live_approval_contract.md. Blank = no live NAVER answer can leave this
        # process (NaverAnswerLiveGuard throws before the request is built). An ENVIRONMENT-binding
        # token, never a credential.
        live-approval-id: ${SELLEROPS_INQUIRY_PUBLISH_NAVER_LIVE_APPROVAL_ID:}
      cafe24:
        # The live-run approval id a Cafe24 answer POST must be armed with, per
        # docs/sellerops_live_approval_contract.md. Blank = no live Cafe24 answer can leave this
        # process (Cafe24ReplyArticleClient throws Cafe24WriteApprovalRequired before the request is
        # built). An ENVIRONMENT-binding token, never a credential.
        live-approval-id: ${SELLEROPS_INQUIRY_PUBLISH_CAFE24_LIVE_APPROVAL_ID:}
        # The `client_ip` Cafe24 requires on a board POST — the writer's IP, which for a server-posted
        # answer is THIS deployment's egress address. Blank = no send (the adapter refuses before the
        # request is built), because a fabricated or looked-up IP would be a claim we cannot make: it
        # is DEPLOYMENT_CONFIGURED by contract (Cafe24ReplyRequestShape), never discovered at runtime
        # and never copied from an observed past reply.
        client-ip: ${SELLEROPS_INQUIRY_PUBLISH_CAFE24_CLIENT_IP:}
        # Which shop of the mall the answer is written into. 0 = no send. The contract documents a
        # default of 1, and that default is the PLATFORM's — this value must come from having OBSERVED
        # the target article's own `shop_no` (an approved bounded READ), so that an unobserved shop
        # can never be mistaken for a decided one.
        shop-no: ${SELLEROPS_INQUIRY_PUBLISH_CAFE24_SHOP_NO:0}
    signature:
      enabled: ${SELLEROPS_INQUIRY_SIGNATURE_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_INQUIRY_SIGNATURE_ORG_IDS:}
      vendor: ${SELLEROPS_INQUIRY_SIGNATURE_VENDOR:OPENAI}
      model: ${SELLEROPS_INQUIRY_SIGNATURE_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_INQUIRY_SIGNATURE_API_KEY:}
      # Shared with internal reasoning on a reasoning model, so a budget sized for the two-label answer
      # is spent before any answer is emitted — arriving as `budget_exhausted`. The draft capability
      # documents the identical trap; measured again here on 2026-08-21 before the value was raised.
      max-output-tokens: ${SELLEROPS_INQUIRY_SIGNATURE_MAX_OUTPUT_TOKENS:2000}
      reasoning-effort: ${SELLEROPS_INQUIRY_SIGNATURE_REASONING_EFFORT:low}
      max-text-chars: ${SELLEROPS_INQUIRY_SIGNATURE_MAX_TEXT_CHARS:2000}
      max-batch-per-call: ${SELLEROPS_INQUIRY_SIGNATURE_MAX_BATCH:200}
  # ── Image Product Knowledge v1 (2026-08-27): the SIXTH LLM capability ────────────────────────
  #
  # Its own switch, its own key and — uniquely — its own MODEL. Every other capability here defaults
  # to gpt-5-2025-08-07, which the vendor's own documentation marks deprecated and scheduled for
  # shutdown; migrating all six is a separate decision, and inheriting a shutdown-scheduled snapshot
  # into a brand new lane would have been the worst of both.
  #
  # This is the heaviest exposure of the six: the payload is the SELLER'S OWN PICTURE, and nobody has
  # read it before it leaves. What the floor test can still guarantee is that nothing goes WITH it —
  # no product title, no option list, no customer question, no identifier.
  #
  # max-output-tokens is 1,200 rather than the 4,000 the others use, and reasoning-effort is `none`:
  # the answer is a bounded list of triples, the budget is shared with reasoning on this model, and
  # 4,000 would put a 26-image run over its approved cost ceiling for nothing.
  product:
    image-knowledge:
      enabled: ${SELLEROPS_IMAGE_KNOWLEDGE_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_IMAGE_KNOWLEDGE_ORG_IDS:}
      vendor: ${SELLEROPS_IMAGE_KNOWLEDGE_VENDOR:OPENAI}
      model: ${SELLEROPS_IMAGE_KNOWLEDGE_MODEL:gpt-5.6-terra}
      api-key: ${SELLEROPS_IMAGE_KNOWLEDGE_API_KEY:}
      max-output-tokens: ${SELLEROPS_IMAGE_KNOWLEDGE_MAX_OUTPUT_TOKENS:1200}
      reasoning-effort: ${SELLEROPS_IMAGE_KNOWLEDGE_REASONING_EFFORT:none}
    detail:
      enrichment:
        # The 상세페이지 text lane. OFF by default (2026-08-27): a capability that has never run live
        # must not start reading a seller's channel because a class was merged.
        enabled: ${SELLEROPS_PRODUCT_DETAIL_ENRICHMENT_ENABLED:false}
  # ── Semantic knowledge retrieval (Knowledge Retrieval Quality v1, 2026-09-03) ──────────────────
  #
  # THE SEVENTH LLM capability, and the only one whose payload includes something on EVERY search:
  #   * the seller's own knowledge passages, once each, turned into vectors and cached by content; and
  #   * the customer's question, embedded per search and never stored.
  # The second is a widening — a draft that ends in NO_ANSWER_BASIS calls no drafter today, and a
  # seller's knowledge search box calls nothing at all. So this is OFF by default and turning it on is
  # a deployment decision: with it off every lane behaves exactly as it did before this package, and
  # the lexical scorer answers as it always has.
  #
  # `dimensions` is measured, not decorative: the same model truncated to 256 answered 88.9% of the
  # benchmark's «nothing here answers this» questions with a citation, because a short vector cannot
  # tell «about this product» from «about this question». 1024 is the shipped value.
  knowledge:
    # Production Knowledge Bootstrap (Customer Ops Product Quality Closure v1): a connected seller's past NAVER
    # inquiries + published answers over `history-days`, and the detail of up to `max-products` discussed products.
    # The seller-pressed path needs no switch; the automatic lane for newly connected sellers is OFF by default.
    bootstrap:
      history-days: ${SELLEROPS_KNOWLEDGE_BOOTSTRAP_HISTORY_DAYS:90}
      max-products: ${SELLEROPS_KNOWLEDGE_BOOTSTRAP_MAX_PRODUCTS:30}
      # Catalogue Knowledge Bootstrap v1: API-first — the channel's product LIST is read first (skipped while a
      # finished one is younger than `catalogue-refresh-hours`), then the detail/options/attributes of EVERY on-sale
      # listing on a channel that publishes them (NAVER), never-read first. `max-catalogue-products` is a per-run
      # ceiling reported as `remaining`, not a sample. Same one-request-per-product trigger and the same product-detail
      # switch; nothing is read while that switch is off.
      max-catalogue-products: ${SELLEROPS_KNOWLEDGE_BOOTSTRAP_MAX_CATALOGUE_PRODUCTS:500}
      catalogue-refresh-hours: ${SELLEROPS_KNOWLEDGE_BOOTSTRAP_CATALOGUE_REFRESH_HOURS:24}
      auto:
        enabled: ${SELLEROPS_KNOWLEDGE_BOOTSTRAP_AUTO_ENABLED:false}
    embedding:
      enabled: ${SELLEROPS_KNOWLEDGE_EMBEDDING_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_KNOWLEDGE_EMBEDDING_ORG_IDS:}
      model: ${SELLEROPS_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-3-large}
      api-key: ${SELLEROPS_KNOWLEDGE_EMBEDDING_API_KEY:}
      dimensions: ${SELLEROPS_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
    # ── Retrieval intent (Knowledge Retrieval Quality v2, 2026-09-03) ──────────────────────────
    #
    # THE EIGHTH capability. It restates ONE customer sentence as what information that sentence
    # needs, before the sentence is embedded — so 「자꾸 붕 뜨는데요」 and the seller's 「접착면이 들뜰
    # 수 있습니다」 can meet. Measured on the v2 benchmark (114 questions, 4 domains): recall 79.6%
    # → 93.5%, and no-evidence precision went UP as well. Its payload is one customer sentence and
    # nothing else — no passage, no product, no identifier — and its output is embedded, never
    # stored and never quoted. Only questions a CUSTOMER wrote pay for it: a seller typing into
    # their own library already uses their own words.
    intent:
      enabled: ${SELLEROPS_KNOWLEDGE_INTENT_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_KNOWLEDGE_INTENT_ORG_IDS:}
      model: ${SELLEROPS_KNOWLEDGE_INTENT_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_KNOWLEDGE_INTENT_API_KEY:}
      max-output-tokens: ${SELLEROPS_KNOWLEDGE_INTENT_MAX_OUTPUT_TOKENS:400}
      reasoning-effort: ${SELLEROPS_KNOWLEDGE_INTENT_REASONING_EFFORT:minimal}
    # ── Evidence eligibility (Knowledge Retrieval Quality v2, 2026-09-03) ──────────────────────
    #
    # THE NINTH capability, and a REFUSAL-ONLY gate: after ranking, it asks whether each passage
    # that would have been quoted actually holds a fact for this question, and can only remove one.
    # 「물에 닿아도 되나요?」 and 「부착 전 유분을 제거하세요」 are genuinely close and one does not
    # answer the other; no threshold separates them. Measured: wrong-source 2.2% → 0% and
    # no-evidence precision 85.7% → 100%. Its payload is wider than either neighbour's — the
    # customer's sentence AND the seller's passages in one request — which is why it is its own flag
    # and its own key. Bounded to six passages per search; searches that found nothing pay nothing.
    eligibility:
      enabled: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_ORG_IDS:}
      model: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_API_KEY:}
      max-output-tokens: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_MAX_OUTPUT_TOKENS:600}
      reasoning-effort: ${SELLEROPS_KNOWLEDGE_ELIGIBILITY_REASONING_EFFORT:minimal}
  customermemory:
    retriever:
      # Retrieval strategy behind the CustomerMemoryRetriever port. `lexical` is the only implementation:
      # deterministic, over closed vocabulary that never left this database, no vendor call. An embedding
      # implementation would send customer bodies to a vendor in bulk — a data-minimization decision scope
      # lock v1.12 deliberately left closed. Naming a provider that does not exist stops the boot loudly.
      provider: ${SELLEROPS_CUSTOMER_MEMORY_RETRIEVER:lexical}
  vault:
    # Credential vault master key: base64-encoded 32 bytes (AES-256). Local
    # throwaway only — never commit a real key; KMS-backed keys are a later
    # phase. Empty = vault fails closed (mock collection needs no credentials).
    master-key-base64: ${SELLEROPS_VAULT_MASTER_KEY:}
    # The key id NEW credentials are stamped with. It is a label this deployment chooses — it is
    # not proof of which key sealed anything, which is why every row now also carries a key
    # fingerprint (V53).
    key-id: ${SELLEROPS_VAULT_KEY_ID:local-dev-1}
    # Retired keys, read-only, as "id:base64,id:base64". Present so a key rotation does not orphan
    # every stored credential: a row is opened with the key that sealed IT, not with whatever this
    # runtime writes with today. Empty by default.
    key-ring: ${SELLEROPS_VAULT_KEY_RING:}
  responsibility:
    # Responsibility Runtime v1 (docs/responsibility_runtime_v1.md). Off by default — no window is materialized
    # and no run executes until ops flips this. The cadence is NOT here: CUSTOMER_OPERATIONS_V1 works fixed 2-hour
    # Asia/Seoul windows, and this interval is only how often the runtime looks.
    scheduler-enabled: ${SELLEROPS_RESPONSIBILITY_SCHEDULER_ENABLED:false}
    poll-interval-ms: ${SELLEROPS_RESPONSIBILITY_POLL_INTERVAL_MS:30000}
    # A RUNNING run's holder renews its lease every heartbeat; a holder that stops (crash, kill) loses the run once
    # the lease passes, and the next tick reclaims the same run with attempt + 1.
    lease-seconds: ${SELLEROPS_RESPONSIBILITY_LEASE_SECONDS:180}
    heartbeat-seconds: ${SELLEROPS_RESPONSIBILITY_HEARTBEAT_SECONDS:30}
    # How long a run waits for a collection another trigger already has in flight before recording TIMEOUT.
    adopt-wait-seconds: ${SELLEROPS_RESPONSIBILITY_ADOPT_WAIT_SECONDS:900}
    # Package B rollout. A window is worked only for an organisation named here AND whose responsibility is ACTIVE —
    # seller acceptance alone opens nothing. Explicit organisation UUIDs, comma-separated; blank = nobody; no wildcard.
    runtime-org-ids: ${RESPONSIBILITY_RUNTIME_ORG_IDS:}
    # Scheduled Aside v1 (Package C §3): a run may additionally ask this organisation's INSTALLED helper to read one
    # surface Reviewnary itself serves on loopback. Off by default and named per organisation, exactly like the
    # rollout above — a helper never runs anything unattended because a build happened to contain this code. The
    # job carries no URL, prompt, script or credential: the recipe is an allow-listed enum and the helper resolves
    # it to its own fixture route, refusing any other target locally. Never a marketplace.
    aside:
      enabled: ${SELLEROPS_RESPONSIBILITY_ASIDE_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_RESPONSIBILITY_ASIDE_ORG_IDS:}
      # How long a run waits for the helper to take the job and report. Bounded: a helper that never answers
      # leaves NONE + DEVICE_OFFLINE, never a zero.
      #
      # PILOT_ACCEPTED_LIMITATION: this wait is spent INSIDE the run thread (the same shape as adopt-wait-seconds
      # for a channel collection). Accepted for the first pilot — one organisation, one device, one recipe — and
      # deliberately far under lease-seconds so a waiting run never loses its own lease. A deployment with many
      # organisations should move to an asynchronous hand-off rather than a longer wait.
      wait-seconds: ${SELLEROPS_RESPONSIBILITY_ASIDE_WAIT_SECONDS:120}
      # Marketplace Scheduled Operations: the same lane, pointed at the seller's OWN store screen instead of a
      # surface we serve ourselves. Its own switch and its own two lists, because it is its own decision — the
      # loopback lane above never consults these, and turning these on widens nothing that was already running.
      #
      # The account list is what makes this different from every other rollout in this file. An organisation is
      # not enough: a deployment must name the exact seller account whose store may be read while nobody is
      # watching. Blank is nobody on both lines, there is no wildcard, and an unparsable id fails at boot rather
      # than quietly becoming «nobody» (which would read as «off» while being a misconfiguration).
      #
      # What the job still cannot carry: a URL, a prompt, a script, a credential. The recipe name is the whole
      # instruction; the helper resolves it to one route its own bound workflow publishes, screens that route
      # with the product's WING classifier before opening anything, reads ONE page, and performs zero clicks,
      # zero keystrokes, zero downloads and zero writes.
      marketplace:
        enabled: ${SELLEROPS_RESPONSIBILITY_ASIDE_MARKETPLACE_ENABLED:false}
        enabled-org-ids: ${SELLEROPS_RESPONSIBILITY_ASIDE_MARKETPLACE_ORG_IDS:}
        enabled-account-ids: ${SELLEROPS_RESPONSIBILITY_ASIDE_MARKETPLACE_ACCOUNT_IDS:}
    # The case investigator (Package B §4): the eleventh LLM capability. Its payload is one REDACTED customer inquiry
    # or review plus closed facts and short excerpts of the seller's own knowledge. Off three ways, never widened by
    # the Agent access policy, and reached only for a case the deterministic rules could not settle.
    investigation:
      enabled: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_ORG_IDS:}
      vendor: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_VENDOR:OPENAI}
      model: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_MODEL:gpt-5-2025-08-07}
      api-key: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_API_KEY:}
      max-output-tokens: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_MAX_OUTPUT_TOKENS:2500}
      reasoning-effort: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_REASONING_EFFORT:low}
      # At most this many investigations per run; further candidates wait for the next run with nothing written.
      max-per-run: ${SELLEROPS_RESPONSIBILITY_INVESTIGATION_MAX_PER_RUN:5}
  collect:
    # Scheduled collection poller (Phase 3B Slice 4). Off by default — nothing
    # polls until ops flips this; the file-upload path is unaffected either way.
    scheduler-enabled: ${SELLEROPS_COLLECT_SCHEDULER_ENABLED:false}
    poll-interval-ms: ${SELLEROPS_COLLECT_POLL_INTERVAL_MS:60000}
    # Single-flight orphaned-run recovery (SyncRunGate): a RUNNING sync older than
    # this is treated as abandoned (crash/restart mid-run) and failed closed the next
    # time a run for the same (account, data type) starts, so it never blocks forever.
    # Chosen well ABOVE any legitimate single-run wall-time — per-request HTTP timeout
    # is 20s so no run hangs indefinitely; a real manual run was observed at ~8.6 min;
    # the scheduler's floor interval is 15 min. 60 min is a wide safety margin (a live
    # run is never falsely reclaimed) while still recovering an orphan within the hour.
    # Raise it for stores whose syncs legitimately run longer.
    sync-stale-after-minutes: ${SELLEROPS_COLLECT_SYNC_STALE_AFTER_MINUTES:60}
  self-pilot:
    # Self-Pilot Runtime v1 (product-owner decision 2026-08-18; docs/self_pilot_runtime_v1.md).
    # The operator runs SellerOps on their own seller accounts for days: routine READ work —
    # official-API collection on the scheduler + bounded AI triage — runs without a per-run
    # approval ceremony; marketplace WRITE is untouched. Off by default; with it off nothing
    # here exists (no reconciler bean, no ticks) and every gate below behaves as before.
    enabled: ${SELLEROPS_SELF_PILOT_ENABLED:false}
    # ALLOW_LIST (default): only org-ids below. LOCAL_SINGLE_USER: every org in THIS backend's database —
    # the one-seller local deployment, where a person who signs up in the browser is picked up with no env
    # edit. LOCAL_SINGLE_USER refuses to boot unless SPRING_DATASOURCE_URL points at localhost/127.0.0.1.
    # CONNECTED_SELLERS (the pilot posture, Pilot Runtime Foundation v1 §6): every org that owns a
    # CONNECTED, non-file-upload seller account — the orgs that ASKED, read from the database, so a new
    # seller's routine collection does not wait on an env edit and a restart. Needs no loopback fence
    # because it is not "every org"; an org with no connected account is not a target.
    scope: ${SELLEROPS_SELF_PILOT_SCOPE:ALLOW_LIST}
    # Comma-separated org UUIDs the runtime acts for under ALLOW_LIST. Empty ⇒ acts for nobody.
    org-ids: ${SELLEROPS_SELF_PILOT_ORG_IDS:}
    # Standing READ grant (spr-<8..32 hex>): opens READ-only Coupang signed GETs for the runtime's
    # lifetime instead of a per-run SELLEROPS_CONNECTOR_COUPANG_LIVE_APPROVAL_ID. Environment-binding
    # token, never a credential; refused by every WRITE gate (CoupangLiveCallGuard.ensureLiveWriteAllowed).
    read-grant-id: ${SELLEROPS_SELF_PILOT_READ_GRANT_ID:}
    # Cadence of the schedules the reconciler creates for a newly CONNECTED account (floor 15).
    default-interval-minutes: ${SELLEROPS_SELF_PILOT_DEFAULT_INTERVAL_MINUTES:60}
    reconcile-interval-ms: ${SELLEROPS_SELF_PILOT_RECONCILE_INTERVAL_MS:300000}
    reconcile-initial-delay-ms: ${SELLEROPS_SELF_PILOT_RECONCILE_INITIAL_DELAY_MS:15000}
    triage:
      # Bounded automatic AI triage — needs sellerops.triage.ai-pilot enabled for the org too.
      auto-enabled: ${SELLEROPS_SELF_PILOT_TRIAGE_AUTO_ENABLED:false}
      per-tick: ${SELLEROPS_SELF_PILOT_TRIAGE_PER_TICK:20}
      per-day: ${SELLEROPS_SELF_PILOT_TRIAGE_PER_DAY:200}
  proactive:
    # Proactive Operations Agent v1 — SellerOps investigates today's work and prepares it before the
    # seller goes looking for it. Off by default; with this false the scheduler bean does not exist,
    # no case is ever prepared, and every existing screen behaves exactly as it did.
    #
    # WHICH ORGS is an INTERSECTION: org-ids below, filtered by the orgs Self-Pilot Runtime v1 allows
    # a background loop to act for at all (sellerops.self-pilot.*), which carries the multi-tenant
    # fence for that question. All of enabled / org-ids / self-pilot must be on.
    #
    # The cap is budget protection, not throttling for its own sake: an inquiry investigation spends
    # the org's daily AI budget on the same counter a seller-initiated draft does, and an uncapped
    # pass over a backlog would spend the day before the seller ever opened a screen. There is no
    # reserved slice for the loop — it competes for the same quota and yields when it is gone.
    enabled: ${SELLEROPS_PROACTIVE_ENABLED:false}
    # Expensive preparations per org per DAY — inquiries and reviews TOGETHER (product-owner
    # correction 2026-08-25). Not per tick: a per-tick cap bounds a moment, and ten ticks of three is
    # thirty. Not per lane either: "3 inquiries and 5 reviews" is not a budget anyone decided.
    # Counted off proactive_case itself — no second ledger — over the SAME day the Agent quota uses.
    daily-cap: ${SELLEROPS_PROACTIVE_DAILY_CAP:3}
    # How many rows each lane's candidate read returns before the two are merged into one selection.
    # A read bound, not a budget.
    candidate-scan: ${SELLEROPS_PROACTIVE_CANDIDATE_SCAN:50}
    reconcile-per-tick: ${SELLEROPS_PROACTIVE_RECONCILE_PER_TICK:50}
    # Which orgs this loop may investigate. Blank is fail closed — never "everybody". Deliberately NOT
    # inherited from self-pilot's scope: the local deployment runs LOCAL_SINGLE_USER ("every org in
    # this database", 35 of them), and a proactive loop that inherited it would have begun preparing
    # work for every one of them on the day it was switched on. The effective set is the INTERSECTION
    # of this list and the orgs self-pilot allows a background loop to act for.
    org-ids: ${SELLEROPS_PROACTIVE_ORG_IDS:}
    #
    # There is deliberately NO freshness boundary here any more. It lives on the org
    # (organizations.proactive_baseline_at), written once by the reconciler on the first tick it runs
    # for that org: activation IS the baseline. An env var made "when was this org activated" a fact
    # about a deployment rather than about the org — and a value someone can retype is a flood someone
    # can re-open.
    interval-ms: ${SELLEROPS_PROACTIVE_INTERVAL_MS:600000}
    initial-delay-ms: ${SELLEROPS_PROACTIVE_INITIAL_DELAY_MS:45000}
  admin:
    inquiry-dismissal:
      # Operator-only bulk inquiry-dismissal admin endpoints (audited spam set-aside
      # from an approved manifest). Off by default — with this false the whole
      # controller is not registered (both /api/admin/inquiry-dismissals routes 404)
      # and no SecurityConfig rule changes. Flip on only for a supervised, approved
      # run; even then it additionally requires the OWNER role and authenticated org
      # ownership. Never enable in an environment that should not run dismissals.
      enabled: ${SELLEROPS_ADMIN_INQUIRY_DISMISSAL_ENABLED:false}
  connector:
    # <b>A channel whose own connector is off must COLLECT NOTHING — not synthesize.</b>
    # Pilot Readiness Closure v1 §8, closed the rest of the way in Pilot Connection & External Proof
    # Gate v1 §3. MockApiConnector synthesizes reviews and inquiries offline, and what it produces is
    # written through the ordinary ingest path as data_origin=REAL — indistinguishable, once stored,
    # from the seller's own. Both switches are therefore OFF unless a deployment asks:
    mock:
      # Does the offline fixture connector exist as a bean at all? Off = it cannot be resolved by any
      # code path. Turn it on only in a local or test deployment that wants the stand-in.
      enabled: ${SELLEROPS_CONNECTOR_MOCK_ENABLED:false}
    mock-fallback:
      # May a channel with NO dedicated connector be served by a connector that declares no channel?
      # Off = a channel whose own connector flag is off resolves to nothing, and its syncs record a
      # configuration failure instead of succeeding with invented rows. Independent of the switch
      # above on purpose: neither fence relies on the other being right.
      enabled: ${SELLEROPS_CONNECTOR_MOCK_FALLBACK_ENABLED:false}
    naver:
      # Real Naver Commerce API connector (Phase 3C Slice 1a). Off by default —
      # the connector beans are not even created, and NAVER keeps resolving to
      # the mock connector. Seller credentials never live here: they enter via
      # the credential intake API into the vault, per seller account.
      enabled: ${SELLEROPS_CONNECTOR_NAVER_ENABLED:false}
      base-url: ${SELLEROPS_CONNECTOR_NAVER_BASE_URL:https://api.commerce.naver.com}
      # Official default capacity: 2 requests/second per application, metered
      # per API (verified 2026-06-12). Reserved for Slice 1b request pacing.
      rate-limit-rps: ${SELLEROPS_CONNECTOR_NAVER_RATE_LIMIT_RPS:2}
      # productOrderIds per product-orders/query request. The official maximum
      # is unconfirmed — 300 is the commonly cited ceiling, so values above it
      # are rejected at startup; 100 is a conservative default.
      order-detail-batch-size: ${SELLEROPS_CONNECTOR_NAVER_ORDER_DETAIL_BATCH_SIZE:100}
      # The fixed public egress IPv4(s) the backend makes NAVER API calls from —
      # the value a seller registers in their app's 'API 호출 IP'. This DECLARES an
      # infra-guaranteed value for the setup tutorial to display; it does NOT pin
      # or change the actual egress. Comma-separated, ≤3 (NAVER's per-app cap).
      # DEFAULT EMPTY: no real IP is committed — the value is injected only from the
      # environment/secret manager per deployment, and an empty value fails safe (the
      # tutorial shows generic guidance, never a fabricated IP).
      advertised-egress-ips: ${SELLEROPS_CONNECTOR_NAVER_ADVERTISED_EGRESS_IPS:}
      inquiry:
        # NAVER publishes TWO official inquiry READ resources, and each gets its own
        # flag. Both off by default: with both off the connector does not advertise
        # INQUIRY at all, and behaviour is byte-identical to before the lane existed.
        #
        # Per-source flags are the fence AND the measuring instrument. The self-pilot
        # reconciler creates a 60-minute routine schedule for every routine data type a
        # connected account's connector advertises, so "advertise INQUIRY" is a standing
        # marketplace call five minutes later — see the NEEDS_VERIFICATION gate in
        # NaverApiConnector. And with exactly one flag on, an approved bounded run makes
        # calls to exactly one endpoint, which is how a live proof measures one source.
        #
        # NAVER TalkTalk has no Commerce API and has no flag here; it is a coverage
        # limitation, not a switch. docs/naver_inquiry_api_audit_v1.md
        product-qna:
          # GET /v1/contents/qnas — 상품 문의 (스마트스토어 Q&A)
          enabled: ${SELLEROPS_CONNECTOR_NAVER_INQUIRY_PRODUCT_QNA_ENABLED:false}
        customer:
          # GET /v1/pay-user/inquiries — 고객 문의 (네이버페이)
          enabled: ${SELLEROPS_CONNECTOR_NAVER_INQUIRY_CUSTOMER_ENABLED:false}
    coupang:
      # Coupang WING Open API order connector. Off by default — beans absent,
      # COUPANG keeps resolving to the mock connector and runtime is byte-identical.
      # Flag-on wires the real ORDER_SUMMARY connector; a live call then still needs
      # a valid stored credential AND (see live-approval-id below) an armed operator
      # approval. Seller credentials never live here: they enter via the credential
      # intake API into the vault, per seller account.
      enabled: ${SELLEROPS_CONNECTOR_COUPANG_ENABLED:false}
      # Official gateway host (verified 2026-06-12 from the PO-list endpoint
      # doc on developers.coupangcorp.com).
      base-url: ${SELLEROPS_CONNECTOR_COUPANG_BASE_URL:https://api-gateway.coupang.com}
      # Backend live-run approval interlock (docs/sellerops_live_approval_contract.md).
      # Empty by default: a live call to a REAL Coupang gateway host fail-closes
      # (CoupangLiveApprovalRequiredException) unless an operator-minted approval id is
      # armed by tools/coupang-local/run-backend-local.sh. Loopback / *.test / *.local
      # base URLs (offline tests, stubs) never require it. Env-binding token, not a secret.
      live-approval-id: ${SELLEROPS_CONNECTOR_COUPANG_LIVE_APPROVAL_ID:}
      # Official throttle threshold: >5 calls/second per vendorId triggers
      # 429s, whole-API scope (verified 2026-06-12). Reserved for request
      # pacing in the order-collection slice.
      rate-limit-rps: ${SELLEROPS_CONNECTOR_COUPANG_RATE_LIMIT_RPS:5}
    cafe24:
      # Cafe24 Admin API connector (Phase 3D-3 auth skeleton). Off by default —
      # beans absent, CAFE24 keeps resolving to the mock connector. The
      # skeleton exposes no collectable data type, so even flag-on cannot reach
      # HTTP through any scheduler/manual path. No base-url key: the API host
      # is per-mall (https://{mall_id}.cafe24api.com), built from the vaulted
      # mall_id. Seller credentials (mall_id/client_id/client_secret/
      # refresh_token) never live here: they enter via the credential intake
      # API into the vault, per seller account.
      enabled: ${SELLEROPS_CONNECTOR_CAFE24_ENABLED:false}
      # Official leaky bucket: capacity 40 per mall, drains 2/sec; >10 rps per
      # IP may be flagged abnormal (verified 2026-06-12). Reserved for request
      # pacing in later collection slices.
      rate-limit-rps: ${SELLEROPS_CONNECTOR_CAFE24_RATE_LIMIT_RPS:2}
      # Pinned Cafe24 Admin-API version, sent as X-Cafe24-Api-Version on admin
      # (v2) data calls. Blank FAILS CLOSED (the transport throws at startup), so
      # an enabled connector never calls an unspecified version (Cafe24 would
      # otherwise apply the app default, which can shift behavior silently). Not
      # sent on the OAuth token/authorize endpoints. Current verified value: 2025-12-01.
      api-version: ${SELLEROPS_CONNECTOR_CAFE24_API_VERSION:}
      # "Connect Cafe24" OAuth onboarding (behind the same enabled flag). The
      # client-id/secret are the ONE registered SellerOps Cafe24 app's — app-level
      # config, never per-seller vault material; empty by default (flow unusable
      # until an operator supplies them, never committed). Scopes are READ-ONLY by
      # contract — a value containing "write" fails the service closed at startup.
      oauth:
        client-id: ${SELLEROPS_CONNECTOR_CAFE24_CLIENT_ID:}
        client-secret: ${SELLEROPS_CONNECTOR_CAFE24_CLIENT_SECRET:}
        redirect-uri: ${SELLEROPS_CONNECTOR_CAFE24_REDIRECT_URI:http://localhost:8080/api/connect/cafe24/callback}
        # READ-ONLY by contract — a value containing "write" fails the service closed at startup.
        #
        # mall.read_product must be here. Cafe24OnboardingConfiguration's own @Value default has listed
        # all three since Operator Graph v2, with a comment promising "new connections consent to all
        # three at once" — but a @Value default only applies when the property is ABSENT, and this line
        # has always supplied one. So the promise was false in every deployment: a seller who
        # reconnected would consent to two scopes, the product read would keep returning
        # insufficient_scope, and they would be asked to reconnect a second time to fix it.
        scopes: ${SELLEROPS_CONNECTOR_CAFE24_SCOPES:mall.read_community,mall.read_order,mall.read_product}
        # The scope set requested ONLY when a seller explicitly turns on 답변 실행 — the read scopes
        # above plus exactly `mall.write_community`, validated as that shape at startup
        # (Cafe24ScopeContract). Blank = the reconsent entry point does not exist and every connection
        # stays read-only; it can never widen `scopes` above, so a write grant cannot happen silently.
        answer-execution-scopes: ${SELLEROPS_CONNECTOR_CAFE24_ANSWER_EXECUTION_SCOPES:}
        result-redirect-url: ${SELLEROPS_CONNECTOR_CAFE24_RESULT_URL:http://localhost:3000/connect/cafe24/result}
        state-ttl-seconds: ${SELLEROPS_CONNECTOR_CAFE24_STATE_TTL_SECONDS:600}
    esm:
      # ESM Trading API connector for G마켓/옥션 (Phase 3D-4 auth skeleton).
      # Off by default — beans absent, GMARKET keeps resolving to the mock
      # connector. The skeleton exposes no collectable data type, so even
      # flag-on cannot reach HTTP. Seller credentials (master_id/secret_key/
      # issuer/seller ids) never live here: they enter via the credential
      # intake API into the vault, per seller account.
      enabled: ${SELLEROPS_CONNECTOR_ESM_ENABLED:false}
      # Official Sell-API endpoint host (verified 2026-06-12 from the official
      # order-API docs on etapi.gmarket.com). Unused until the order slice.
      base-url: ${SELLEROPS_CONNECTOR_ESM_BASE_URL:https://sa2.esmplus.com}
      # The only officially published limit is per order-query endpoint:
      # 1 call per 5 seconds per seller id per token (notice, 2025-04-23) —
      # an interval, not an rps figure. Reserved for request pacing in the
      # order-collection slice.
      order-query-interval-seconds: ${SELLEROPS_CONNECTOR_ESM_ORDER_QUERY_INTERVAL_SECONDS:5}
    elevenst:
      # 11st (11번가) Seller Open API connector (Phase 3D-5 auth skeleton).
      # Off by default — beans absent, ELEVENST keeps resolving to the mock
      # connector. The skeleton exposes no collectable data type, so even
      # flag-on cannot reach HTTP. Auth is a single static key sent as the
      # `openapikey` header; the key never lives here — it enters via the
      # credential intake API into the vault, per seller account, and works
      # only from IPs registered at the 11st Open API portal.
      enabled: ${SELLEROPS_CONNECTOR_ELEVENST_ENABLED:false}
      # Seller API host as publicly printed in the official FAQ (verified
      # 2026-06-12: "http://api.11st.co.kr/rest/..."). The official example
      # prints plain http, but TLS on this host was verified reachable the
      # same day, so the default is https — credential-bearing calls must
      # never downgrade to plaintext. Scheme re-confirmation is a live-smoke
      # item. Unused until the order slice.
      base-url: ${SELLEROPS_CONNECTOR_ELEVENST_BASE_URL:https://api.11st.co.kr}
      # No rate-limit key on purpose: 11st publishes no call limit anywhere
      # on the official portal (re-verified 2026-06-12) — an rps figure here
      # would be invented. Pacing is decided at the order slice.
    ssg:
      # SSG.COM Open API connector (Phase 3D-6 auth skeleton). Off by default
      # — beans absent, SSG keeps resolving to the mock connector. The
      # skeleton exposes no collectable data type, so even flag-on cannot
      # reach HTTP. Auth is a single static 업체 인증키 sent verbatim as the
      # Authorization header; the key never lives here — it enters via the
      # credential intake API into the vault, per seller account. Key
      # issuance is an MD-department request after the 입점 contract; per-key
      # access-IP registration becomes mandatory 2026-06-30 (official
      # notice) — both operator setup duties.
      enabled: ${SELLEROPS_CONNECTOR_SSG_ENABLED:false}
      # Deliberately NO default value: the SSG production API host is not
      # publicly printed in the official docs — every endpoint example on
      # eapi.ssgadm.com is a relative path (re-verified 2026-06-13), so any
      # default would be a guess. Flag-on without an explicit https value
      # fails startup closed; the host is confirmed at key issuance.
      base-url: ${SELLEROPS_CONNECTOR_SSG_BASE_URL:}
      # No rate-limit key on purpose: the only officially published limit is
      # product-update 50,000 calls/hour (notice effective 2025-07-09) — an
      # API family this connector does not implement. Nothing applicable is
      # published; pacing is decided at the first fetch slice.
  # ── Inquiry Decision v2 (need-level coverage, 2026-09-19) ─────────────────────────────────────────────────
  #
  # Splits a customer's inquiry into the independent needs it carries (one call), gathers current evidence for all
  # of them (no model), and has ONE judge say how far the evidence closes each need (one call). Code then derives
  # the basis: every need covered → a draft; any need partial, missing or unreadable → the Case goes to the seller.
  # That is what removes partial-coverage leakage (docs/inquiry_decision_v2.md). Its payload is the customer's
  # inquiry, the seller's candidate evidence and past answers, by position — so it is its own capability, admitted
  # only by its own org list. OFF by default; off, the assessment is exactly what it was.
  inquiry-decision:
    enabled: ${SELLEROPS_INQUIRY_DECISION_ENABLED:false}
    enabled-org-ids: ${SELLEROPS_INQUIRY_DECISION_ORG_IDS:}
    model: ${SELLEROPS_INQUIRY_DECISION_MODEL:gpt-5-2025-08-07}
    api-key: ${SELLEROPS_INQUIRY_DECISION_API_KEY:}
    plan-max-output-tokens: ${SELLEROPS_INQUIRY_DECISION_PLAN_MAX_OUTPUT_TOKENS:800}
    judge-max-output-tokens: ${SELLEROPS_INQUIRY_DECISION_JUDGE_MAX_OUTPUT_TOKENS:1600}
    reasoning-effort: ${SELLEROPS_INQUIRY_DECISION_REASONING_EFFORT:minimal}
  inquiry-import:
    esm:
      # Manual ESM (G마켓/옥션) inquiry Excel-import bridge. Off by default — with this
      # false the controllers and all secret-dependent import beans are not registered
      # (the /api/inquiry-imports/esm routes 404) and the backend starts without a
      # preview-token secret. Flip on only where the import is wanted; even then it
      # additionally requires a strong preview-token secret (below) or fails closed.
      enabled: ${SELLEROPS_INQUIRY_IMPORT_ESM_ENABLED:false}
      account-provisioning:
        # Operator provisioning of file-import GMARKET SellerAccounts. Off by default and
        # separate from normal import operation: the provisioning controller is registered
        # ONLY when BOTH this and `esm.enabled` are true, and even then it additionally
        # requires the OWNER role. Preview/confirm are unaffected by this flag.
        enabled: ${SELLEROPS_INQUIRY_IMPORT_ESM_ACCOUNT_PROVISIONING_ENABLED:false}
    preview-token:
      # HMAC-SHA256 secret for the ESM inquiry-import preview token (binds a preview to
      # the exact file+account+marketplace+result+DB-state; 30-minute expiry; confirm
      # re-verifies server-side). NO committed default — inject a long random value via
      # SELLEROPS_INQUIRY_IMPORT_PREVIEW_TOKEN_SECRET (OS secret store / env). When unset
      # the value is empty and the import path fails closed at startup (min length 16);
      # never commit or log the real secret.
      secret: ${SELLEROPS_INQUIRY_IMPORT_PREVIEW_TOKEN_SECRET:}
  jwt:
    secret: ${SELLEROPS_JWT_SECRET:change-me-local-dev-only-please-use-a-long-random-string}
    exp-minutes: ${SELLEROPS_JWT_EXP_MINUTES:720}
  cors:
    origin: ${SELLEROPS_CORS_ORIGIN:http://localhost:5173}
  # Social login (Google OIDC · NAVER OAuth2) — docs/auth_growth_instrumentation_v1.md. Deployer values,
  # prepared before service start; a provider without BOTH id and secret does not exist (no bean, no
  # endpoint, no button). Success mints a one-time code (never a JWT in a URL); identity is
  # (provider, subject); an email collision is refused, never auto-linked; a first-time identity creates
  # nothing until 상호명 is given (org + user + identity in one transaction).
  oauth:
    google:
      client-id: ${SELLEROPS_OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${SELLEROPS_OAUTH_GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${SELLEROPS_OAUTH_NAVER_CLIENT_ID:}
      client-secret: ${SELLEROPS_OAUTH_NAVER_CLIENT_SECRET:}
    # "" = redirect targets are relative to the public origin the browser used (dev: vite proxy on :5173).
    frontend-base-url: ${SELLEROPS_OAUTH_FRONTEND_BASE_URL:}
    code-ttl-seconds: ${SELLEROPS_OAUTH_CODE_TTL_SECONDS:120}
    onboarding-ttl-seconds: ${SELLEROPS_OAUTH_ONBOARDING_TTL_SECONDS:1800}
    # Expired handoff rows (they carry the provider email/display name) are deleted on this cadence.
    purge-initial-delay-ms: 300000
    purge-interval-ms: 900000
  # Service Readiness v1 — docs/service_readiness_v1.md §5. Public origin of the frontend, used to build links
  # that leave the product (password-reset mail). Not a secret.
  public-base-url: ${SELLEROPS_PUBLIC_BASE_URL:http://localhost:5173}
  # Password reset by mailed one-time link (§2-2): SHA-256 at rest, single use, this TTL. Needs a mailer (below).
  password-reset:
    ttl-seconds: ${SELLEROPS_PASSWORD_RESET_TTL_SECONDS:1800}
  # Mailer (§2-3): smtp (spring.mail.* / SPRING_MAIL_HOST… — boot fails without a host) | dev-outbox (mail is
  # written to THIS LOG, links included — local/self-pilot only, never production) | off (default: reset link
  # hidden, mails dropped without naming an address).
  mail:
    mode: ${SELLEROPS_MAIL_MODE:off}
    from: ${SELLEROPS_MAIL_FROM:no-reply@localhost}
  walkthrough:
    # Disposable NAVER walkthrough environment-identity endpoints (context + operator-tab handshake).
    # OFF by default → the WalkthroughController bean and its routes do not exist in production (any
    # request there is a fail-closed 404). The bootstrap turns this on and injects a per-run opaque id
    # so the operator's tab can be proven bound to THIS backend/DB/runtime. run-id is NOT a secret.
    enabled: ${SELLEROPS_WALKTHROUGH_MODE:false}
    run-id: ${SELLEROPS_WALKTHROUGH_RUN_ID:}
    git-commit: ${SELLEROPS_WALKTHROUGH_GIT_COMMIT:unknown}
    db-alias: ${SELLEROPS_WALKTHROUGH_DB_ALIAS:unknown}
    frontend-origin: ${SELLEROPS_WALKTHROUGH_FRONTEND_ORIGIN:http://localhost:5173}
    backend-origin: ${SELLEROPS_WALKTHROUGH_BACKEND_ORIGIN:http://127.0.0.1:18090}
  seed:
    # The DEMO ORGANISATION fixture — 데모 제조사, its login user and two seller accounts.
    # OFF by default since Pilot Runtime Foundation v1: the user it creates has a password
    # written down in this repository, so a boot that creates it hands a working login to
    # anybody who has read the source. Nothing about the fixture changed — set this true on a
    # clean DB and it seeds exactly as it always did.
    #
    # The 13-channel CATALOGUE is NOT gated by this — see `channel-catalogue` below.
    enabled: ${SELLEROPS_SEED_ENABLED:false}
    # The 13-channel catalogue: product reference data, not a fixture. Default ON and idempotent
    # (written only into an empty table), because without it the 채널 연결 screen has nothing to
    # offer — on a pilot deployment as much as a dev one. Its own switch so a test that must own
    # the channels table can say so; "no demo data" and "no reference data" are different requests.
    channel-catalogue: ${SELLEROPS_SEED_CHANNEL_CATALOGUE:true}
    # Demo content (products/reviews/inquiries/order-summaries) is opt-in and OFF by default so
    # a real DB shows an honest empty inbox/orders. Nested inside the demo organisation above —
    # with `enabled` false this can never seed anything.
    demo-content: ${SELLEROPS_SEED_DEMO_CONTENT:false}
    # Whether this deployment exposes the demo entry at all (the login screen's 「데모 화면 보기」
    # shortcut, which prefills the fixture account). Read by the frontend from a public config
    # endpoint, so a pilot/production deployment never renders a way into an account it did not
    # create. Defaults to whatever `enabled` says: a deployment that seeds the fixture is the one
    # that has an account for the shortcut to open.
    demo-entry: ${SELLEROPS_SEED_DEMO_ENTRY:${SELLEROPS_SEED_ENABLED:false}}
  analysis:
    item:
      # Per-item inbox analysis (inquiries + reviews). The shipped analyzer is
      # rule-based: deterministic, local, no external call — safe on by default.
      # `ai`/`openai` is a reserved, unimplemented value; wiring a real provider is
      # a later slice that would gate its bean behind this flag.
      provider: ${SELLEROPS_ANALYSIS_ITEM_PROVIDER:rule_based}
  review:
    # Review-photo vision (Customer Ops Demo Closure v1): one customer photo + that review's rating and words go to a
    # vision model so an investigation can say what the photo shows. OFF by default and org-scoped — the widest
    # payload any capability here sends. Its own model, as image-knowledge has.
    media-vision:
      enabled: ${SELLEROPS_REVIEW_MEDIA_VISION_ENABLED:false}
      enabled-org-ids: ${SELLEROPS_REVIEW_MEDIA_VISION_ORG_IDS:}
      model: ${SELLEROPS_REVIEW_MEDIA_VISION_MODEL:gpt-5.6-terra}
      api-key: ${SELLEROPS_REVIEW_MEDIA_VISION_API_KEY:}
      max-output-tokens: ${SELLEROPS_REVIEW_MEDIA_VISION_MAX_OUTPUT_TOKENS:600}
      reasoning-effort: ${SELLEROPS_REVIEW_MEDIA_VISION_REASONING_EFFORT:none}
    publish:
      # The review-reply API lane (Agentic Operating Workspace v2 §A2) — reviewnary posting an APPROVED
      # reply as a Cafe24 board comment. Off by default and absent from every deployment that has not
      # deliberately turned it on: with it off NO Cafe24ReviewCommentAdapter bean exists,
      # ReviewExecutionCapability answers NOT_SUPPORTED / EXECUTION_DISABLED, and /reply/execute records
      # a refusal without touching a transport. Independent of the inquiry flag on purpose.
      execution-enabled: ${SELLEROPS_REVIEW_PUBLISH_EXECUTION_ENABLED:false}
      cafe24:
        # The live-run approval id a Cafe24 comment POST must be armed with, per
        # docs/sellerops_live_approval_contract.md. Blank = no live comment can leave this process
        # (Cafe24ReviewCommentClient throws Cafe24WriteApprovalRequired before the request is built).
        # An ENVIRONMENT-binding token, never a credential.
        live-approval-id: ${SELLEROPS_REVIEW_PUBLISH_CAFE24_LIVE_APPROVAL_ID:}
        # Which shop of the mall the comment is written into. Defaults to the inquiry lane's OBSERVED
        # value for this mall; 0 = no send. The contract's default of 1 is the platform's, not ours.
        shop-no: ${SELLEROPS_REVIEW_PUBLISH_CAFE24_SHOP_NO:${SELLEROPS_INQUIRY_PUBLISH_CAFE24_SHOP_NO:0}}
  reply:
    review:
      # Review reply-draft suggestion. The shipped provider is rule-based:
      # deterministic, local, no external call — safe on by default.
      #
      # Unlike `analysis.item.provider` above (declared but not yet read), this flag
      # IS read: RuleBasedReviewReplyProvider is @ConditionalOnProperty on it. Setting
      # any other value therefore leaves no ReviewReplyProposalProvider bean and the
      # application fails to start, loudly, naming the missing type.
      #
      # That is deliberate. `ai` is reserved and unimplemented, and this is the first
      # place a live LLM would enter the product — separately authorized, per roadmap
      # §9.2. A silent fall back to rules would be worse than a failed boot: the
      # operator would be told 규칙 기반 and believe they had asked for something else,
      # or vice versa. Selecting a provider that does not exist should stop the
      # process, not be quietly reinterpreted.
      provider: ${SELLEROPS_REVIEW_REPLY_PROVIDER:rule_based}

logging:
  level:
    org.springframework.security: INFO

# Error monitoring (docs/service_readiness_v1.md §2-1). `sentry.dsn` is deliberately NOT declared here: Sentry's
# auto-configuration exists only when the SENTRY_DSN environment variable (relaxed-bound to sentry.dsn) is set —
# local/dev default = OFF, nothing initialises. The knobs below apply when it is on. Every event passes
# com.sellerops.telemetry.SentryScrub (no query strings, auth headers, cookies, bodies, users). Log→Sentry
# forwarding is off (log lines are not audited for PII); trace headers propagate to NO outgoing host.
sentry:
  environment: ${SELLEROPS_ENV:local}
  release: ${SELLEROPS_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: ${SELLEROPS_SENTRY_TRACES_SAMPLE_RATE:0.1}
  trace-propagation-targets: []
  attach-threads: false
  logging:
    enabled: false
