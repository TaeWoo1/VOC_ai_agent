# NAVER 스마트스토어 / 커머스 API — Channel Knowledge v1
#
# Platform knowledge only. Nothing here is specific to one seller: no 배송 정책, no CS tone, no
# 브랜드 규칙. Those vary per seller and belong to a separate system; mixing them here would tell one
# seller another seller's rules.
#
# Every entry names its source and the date it was last confirmed. `verifiedAt` absent means unknown,
# never "always true". Entries sourced UNVERIFIED are hedged in their own wording.
version: v1
updatedAt: "2026-08-22"
entries:

  # ---------------------------------------------------------------- CAPABILITY
  - id: naver-cap-order
    topic: CAPABILITY
    kind: FACT
    title: 주문은 공식 커머스 API로 수집합니다
    summary: >-
      NAVER ORDER_SUMMARY는 커머스 API로 구현되어 있고 2026-06-14에 라이브 검증되었습니다.
      자동 수집 주기를 걸 수 있는 유일한 NAVER 데이터입니다.
    body: >-
      판매자 애플리케이션에 상품·주문(판매자) API 그룹이 포함되어 있어야 하며, 애플리케이션의
      'API 호출 IP'에 SellerOps 고정 IP가 등록되어 있어야 합니다. IP를 등록하지 않으면 첫 수집이
      호출 IP 오류로 실패합니다. 라이브 검증은 1회(단일 계정)이며 상시 운영 지원 단계는 아닙니다.
    capabilities: [ORDER_SUMMARY]
    tags: [주문, 수집, api, 자동수집]
    source: SELLEROPS_EVIDENCE
    sourceRef: docs/multi-channel-connector-roadmap.md §4.1
    verifiedAt: "2026-06-14"

  - id: naver-cap-review-no-api
    topic: CAPABILITY
    kind: LIMITATION
    title: NAVER는 판매자용 리뷰 API를 제공하지 않습니다
    summary: >-
      스마트스토어에는 리뷰를 읽는 공식 판매자 API가 없습니다. 자동 리뷰 수집은 구현 과제가 아니라
      존재하지 않는 기능이며, 어떤 설정으로도 켜지지 않습니다.
    body: >-
      따라서 "리뷰 자동 수집이 안 된다"는 연결 문제가 아닙니다. 리뷰는 판매자 센터에서 파일로
      내려받아 SellerOps에 올리는 방식이 정식 경로이며(naver-cap-review-export), 새 리뷰는 판매자가
      다시 내보낼 때 들어옵니다. 이 사실을 모르면 연결·권한·IP를 계속 확인하게 되는데 그 중 어느
      것도 원인이 아닙니다.
    capabilities: [REVIEW]
    tags: [리뷰, api없음, 자동수집, 한계]
    source: SELLEROPS_EVIDENCE
    sourceRef: connector_capabilities (NAVER/REVIEW = UNSUPPORTED, 공식 관리자 확인 2024-08-30)
    verifiedAt: "2024-08-30"

  - id: naver-cap-review-export
    topic: CAPABILITY
    kind: PROCEDURE
    title: 리뷰는 판매자 센터 내보내기 파일로 가져옵니다
    summary: >-
      판매자가 스마트스토어 판매자 센터에서 리뷰를 파일로 내려받아 SellerOps에 올리면 수집됩니다.
      SellerOps의 실제 NAVER 리뷰는 전부 이 경로로 들어왔습니다.
    body: >-
      취득 경로 등록: EXPORT · LIVE_PROVEN · SELLER_REPEATED. SELLER_REPEATED가 핵심입니다 —
      새 리뷰는 계속 들어올 수 있지만, 저절로 들어오지는 않습니다. 과거 구간은 월 단위 세그먼트를
      순서대로 안내하는 가이드형 초기 연동으로 채웁니다(2026-07-25 라이브 증명, 1계정·1구간).
      기간은 셀러가 시작 월을 고르는 방식으로 정해지며, 종료일은 오늘입니다. NAVER 리뷰 달력은
      기간을 제한하지 않으므로 "가져올 수 있는 한계"를 따로 탐색하지 않습니다.
    capabilities: [REVIEW]
    tags: [리뷰, 내보내기, export, 초기연동, 가이드]
    source: LIVE_OBSERVATION
    sourceRef: docs/action-window-runtime/naver-initial-review-import-live-proof-record.md
    verifiedAt: "2026-07-25"

  - id: naver-cap-inquiry-none
    topic: CAPABILITY
    kind: LIMITATION
    title: NAVER 문의는 아직 수집 경로가 없습니다
    summary: >-
      NAVER INQUIRY는 방식 자체가 미확정입니다. 공식 API도, 검증된 대체 경로도 없습니다.
    body: >-
      API가 없다는 사실이 다른 경로가 있다는 뜻은 아닙니다. 파일 업로드(공통 경로)만 가능합니다.
      데모 조직에 있던 NAVER 문의 8건은 실데이터가 아니라 시드 데이터였습니다.
    capabilities: [INQUIRY]
    tags: [문의, 미지원, 한계]
    source: SELLEROPS_EVIDENCE
    sourceRef: docs/multi-channel-connector-roadmap.md §4.1 (NAVER/INQUIRY = 미확정)
    verifiedAt: "2026-08-22"

  - id: naver-cap-product
    topic: CAPABILITY
    kind: FACT
    title: 상품 조회는 구현되어 있으나 아직 라이브로 관측된 적이 없습니다
    summary: >-
      NaverProductsClient가 /external/v1/products/search로 채널상품 단위(이름·URL·가격·판매상태·
      브랜드/제조사·카테고리·옵션조합)를 읽습니다. 상태는 NEEDS_VERIFICATION입니다.
    body: >-
      판매자 애플리케이션에 상품 API 권한이 필요하며, 그 권한 부여는 판매자의 행동입니다.
      SellerOps는 우회하지 않습니다. wire shape이 한 번도 관측되지 않았으므로 이 경로가 실제로
      동작한다고 말하지 않습니다 — 구현되어 있다는 것과 검증되었다는 것은 다릅니다.
    capabilities: [PRODUCT]
    tags: [상품, 카탈로그, 권한, 검증필요]
    source: SELLEROPS_EVIDENCE
    sourceRef: docs/multi-channel-connector-roadmap.md §4.1 (NAVER/PRODUCT)
    verifiedAt: "2026-08-21"

  # ---------------------------------------------------------------- CONNECTION
  - id: naver-conn-credentials
    topic: CONNECTION
    kind: FACT
    title: 연결에는 애플리케이션 ID와 시크릿이 필요합니다
    summary: >-
      NAVER는 커머스 API 센터에서 발급한 애플리케이션 ID + 시크릿을 사용합니다. 만료되지 않는
      애플리케이션 키이므로, 한 번 연결하면 토큰 갱신이나 재동의가 필요하지 않습니다.
    body: >-
      OAuth 재동의 흐름이 없다는 점이 Cafe24와 다릅니다. 반대로, 키 값 자체를 잃어버리면 복구
      수단이 없고 판매자가 API 센터에서 다시 확인하거나 시크릿을 재발급해야 합니다.
    capabilities: [ORDER_SUMMARY, PRODUCT]
    tags: [연결, 인증, 애플리케이션, 시크릿]
    source: SELLEROPS_EVIDENCE
    sourceRef: CredentialTemplates (NAVER) · NaverApiConnector
    verifiedAt: "2026-08-22"

  - id: naver-conn-one-app-per-store
    topic: CONNECTION
    kind: LIMITATION
    title: 스토어당 애플리케이션은 1개이고 삭제할 수 없습니다
    summary: >-
      이미 애플리케이션이 있으면 새로 만들지 말고 그 앱을 사용해야 합니다. 잘못 만들면 되돌릴 수
      없습니다.
    body: >-
      연결 안내가 신규 발급 walk와 기존 앱 재사용 walk로 나뉘어 있는 이유입니다. 판매자에게 먼저
      물어야 할 것은 "앱이 이미 있는가"입니다.
    capabilities: [ORDER_SUMMARY, PRODUCT]
    tags: [애플리케이션, 연결, 주의]
    source: SELLEROPS_EVIDENCE
    sourceRef: frontend/src/lib/guidedConnection/tutorial.ts (NAVER_EXISTING_APP_TUTORIAL)
    verifiedAt: "2026-08-22"

  - id: naver-conn-call-ip
    topic: CONNECTION
    kind: FACT
    title: 애플리케이션의 'API 호출 IP'에 SellerOps 고정 IP를 등록해야 합니다
    summary: >-
      SellerOps는 고정된 서버 IP에서 NAVER API를 호출합니다. 이 IP가 애플리케이션에 등록되어
      있지 않으면 첫 주문 수집이 호출 IP 오류로 실패합니다.
    body: >-
      등록할 IP는 배포마다 다르며 SellerOps 연결 화면이 실제 값을 표시합니다. 화면에 표시된 IP가
      없으면 아직 준비되지 않은 것이며, 이 경우 IP를 추측해 등록하면 안 됩니다.
    capabilities: [ORDER_SUMMARY, PRODUCT]
    tags: [ip, 호출ip, 연결오류, 방화벽]
    source: SELLEROPS_EVIDENCE
    sourceRef: docs/sellerops_local_to_pilot_connectivity_decision.md
    verifiedAt: "2026-08-22"

  # ---------------------------------------------------------------- NAVIGATION
  - id: naver-nav-api-center
    topic: NAVIGATION
    kind: PROCEDURE
    title: 키는 커머스 API 센터에서 확인합니다
    summary: >-
      https://apicenter.commerce.naver.com/ 에서 스토어의 통합 매니저 권한이 있는 판매자 계정으로
      로그인한 뒤, 애플리케이션 목록 → 애플리케이션 상세에서 ID와 시크릿을 확인합니다.
    body: >-
      실제 메뉴·버튼 이름은 화면 버전에 따라 다를 수 있습니다. 위치와 역할을 기준으로 찾아야 하며,
      SellerOps는 이 화면을 대신 클릭하지 않습니다 — 공식 센터를 새 탭으로 열어 주기만 합니다.
    capabilities: [ORDER_SUMMARY, PRODUCT]
    tags: [판매자센터, api센터, 위치, 발급]
    source: SELLEROPS_EVIDENCE
    sourceRef: frontend/src/lib/guidedConnection/tutorial.ts (NAVER_API_CENTER_URL)
    verifiedAt: "2026-08-22"

  - id: naver-nav-review-export
    topic: NAVIGATION
    kind: GUIDANCE
    title: 리뷰 파일은 판매자 센터의 리뷰 관리에서 내려받습니다
    summary: >-
      리뷰 목록 화면에서 기간을 지정해 내보내기(엑셀)를 실행한 뒤, 받은 파일을 SellerOps에 올립니다.
    body: >-
      정확한 메뉴 이름은 화면 버전에 따라 다를 수 있으므로 '리뷰'와 '다운로드/엑셀'이 포함된 항목을
      찾으세요. 리뷰 달력은 조회 기간을 제한하지 않으므로 과거 구간도 지정할 수 있습니다. 모든
      클릭은 판매자가 직접 수행하고, SellerOps는 감지·검증·처리만 합니다.
    capabilities: [REVIEW]
    tags: [리뷰, 내보내기, 판매자센터, 위치]
    source: UNVERIFIED
    sourceRef: 감독형 export 라이브 실행에서 관측된 흐름 (메뉴 라벨은 미확정)
    verifiedAt: "2026-07-25"

  # ---------------------------------------------------------- STATUS_SEMANTICS
  - id: naver-status-review-reply-unknown
    topic: STATUS_SEMANTICS
    kind: FACT
    title: 내보내기 파일에는 답변 여부가 담기지 않아 리뷰 답변 상태는 UNKNOWN입니다
    summary: >-
      SellerOps의 NAVER 리뷰는 reply_state = UNKNOWN입니다. 이는 "답변하지 않았다"는 뜻이 아니라
      "알 수 없다"는 뜻입니다.
    body: >-
      소스가 답변 여부를 말해주지 않으면 SellerOps는 추측하지 않습니다. 따라서 "답변 안 한 리뷰"
      집계를 NAVER 리뷰에 대해 신뢰해서는 안 되며, 답변 여부는 판매자 센터에서 확인해야 합니다.
      Agent가 "답변하지 않은 리뷰가 N건"이라고 말하면 그것은 UNKNOWN을 미답변으로 잘못 읽은 것입니다.
    capabilities: [REVIEW]
    tags: [리뷰, 답변, 상태, unknown]
    source: SELLEROPS_EVIDENCE
    sourceRef: com.sellerops.review.ReviewReplyState · IngestionService
    verifiedAt: "2026-08-22"

  # ------------------------------------------------------------------ GLOSSARY
  - id: naver-glossary-product-ids
    topic: GLOSSARY
    kind: TERM
    title: originProductNo와 channelProductNo는 다른 것입니다
    summary: >-
      originProductNo는 원(原)상품, channelProductNo는 채널에 노출된 상품입니다. 하나의 원상품이
      여러 채널상품을 가질 수 있습니다.
    body: >-
      SellerOps는 채널상품 단위(channelProductNo)를 외부 식별자로 저장합니다. 판매자 화면에서
      보이는 상품과 1:1로 맞춰야 할 때 사용해야 하는 값이 이것입니다. 두 값을 섞으면 옵션·가격이
      다른 상품을 같은 것으로 취급하게 됩니다.
    capabilities: [PRODUCT]
    tags: [상품번호, 식별자, originProductNo, channelProductNo]
    source: SELLEROPS_EVIDENCE
    sourceRef: com.sellerops.connector.naver.NaverProductsClient
    verifiedAt: "2026-08-21"

  - id: naver-glossary-order-ids
    topic: GLOSSARY
    kind: TERM
    title: orderId와 productOrderId는 다른 단위입니다
    summary: >-
      orderId는 주문 한 건, productOrderId는 그 주문 안의 상품별 주문입니다. 취소·반품은 보통
      productOrderId 단위로 일어납니다.
    capabilities: [ORDER_SUMMARY]
    tags: [주문번호, 식별자, orderId, productOrderId]
    source: SELLEROPS_EVIDENCE
    sourceRef: com.sellerops.connector.naver (주문 수집 경로)
    verifiedAt: "2026-08-22"

  # ----------------------------------------------------------- TROUBLESHOOTING
  - id: naver-trouble-call-ip
    topic: TROUBLESHOOTING
    kind: GUIDANCE
    title: 첫 주문 수집이 실패하면 호출 IP를 먼저 확인하세요
    summary: >-
      연결은 되었는데 첫 수집만 실패한다면 가장 흔한 원인은 애플리케이션에 SellerOps 고정 IP가
      등록되지 않은 것입니다.
    body: >-
      확인 순서 — (1) SellerOps 연결 화면이 표시하는 고정 IP, (2) NAVER 애플리케이션의 'API 호출 IP'
      설정에 그 값이 그대로 있는지, (3) 애플리케이션에 상품·주문 API 그룹이 포함되어 있는지,
      (4) 애플리케이션이 일시중단 상태가 아닌지('다시사용' 버튼이 보이면 중단된 것입니다).
    capabilities: [ORDER_SUMMARY, PRODUCT]
    tags: [오류, 수집실패, ip, 권한]
    source: SELLEROPS_EVIDENCE
    sourceRef: frontend/src/lib/guidedConnection/tutorial.ts (register_call_ip)
    verifiedAt: "2026-08-22"

  - id: naver-trouble-review-not-updating
    topic: TROUBLESHOOTING
    kind: GUIDANCE
    title: 리뷰가 늘지 않는 것은 고장이 아닙니다
    summary: >-
      NAVER 리뷰는 판매자가 파일을 다시 올릴 때만 늘어납니다. 마지막 업로드 이후 새 리뷰가 없는 것이
      정상 동작입니다.
    body: >-
      확인할 것은 연결 상태가 아니라 마지막 업로드 시점입니다. 최신 리뷰 날짜가 오래되었다면
      판매자에게 다음 내보내기를 안내하는 것이 올바른 조치입니다. 연결·권한·IP를 확인하는 것은
      시간 낭비입니다 — 이 경로는 애초에 연결을 쓰지 않습니다.
    capabilities: [REVIEW]
    tags: [리뷰, 최신화, 오래됨, freshness]
    source: SELLEROPS_EVIDENCE
    sourceRef: AcquisitionPathRegistry (NAVER/REVIEW = EXPORT · SELLER_REPEATED)
    verifiedAt: "2026-08-22"

  # ----------------------------------------------------------------- OPERATIONS
  - id: naver-ops-what-api-cannot-tell
    topic: OPERATIONS
    kind: GUIDANCE
    title: API로 알 수 없는 것은 판매자 센터에서 확인해야 합니다
    summary: >-
      NAVER 커머스 API로는 리뷰, 문의, 리뷰 답변 여부를 알 수 없습니다. 이 세 가지는 판매자 센터
      화면에서만 확인됩니다.
    body: >-
      Agent가 이 세 가지에 대해 단정적으로 답하면 잘못된 것입니다. 올바른 답은 "SellerOps가 가진
      데이터로는 이렇게 보이며, 확실한 것은 판매자 센터에서 확인해야 합니다"입니다.
    capabilities: [REVIEW, INQUIRY]
    tags: [운영, 판단, 한계, 확인]
    source: SELLEROPS_EVIDENCE
    sourceRef: docs/multi-channel-connector-roadmap.md §4.1
    verifiedAt: "2026-08-22"

  # ------------------------------------------------------------------ WORKFLOW
  - id: naver-workflow-review-reply
    topic: WORKFLOW
    kind: FACT
    title: 리뷰 답변은 판매자 센터에서 판매자가 직접 씁니다
    summary: >-
      NAVER는 리뷰 답글 기능을 제공하지만, 그 답글을 API로 쓸 수는 없습니다. SellerOps는 초안을
      만들고 판매자가 판매자 센터에서 실제로 게시합니다.
    body: >-
      SellerOps의 리뷰 답변 흐름은 초안 → 사람의 승인 → 판매자가 직접 게시입니다. 자동 게시는
      제품 동작이 아니며, 승인 없는 전송 경로는 존재하지 않습니다.
    capabilities: [REVIEW]
