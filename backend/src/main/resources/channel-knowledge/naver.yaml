  - id: naver-workflow-order-window
    topic: WORKFLOW
    kind: FACT
    title: 주문은 일자 단위로 집계되어 들어옵니다
    summary: >-
      NAVER 주문 수집은 일자별 요약(order_daily_summaries)과 개별 주문(channel_orders) 두 층으로
      저장됩니다. 개별 주문 층은 상태 변화를 추적할 수 있는 유일한 층입니다.
    body: >-
      일자 요약만 있으면 "그날 몇 건 팔렸는가"는 알 수 있지만 "그 주문이 그 뒤 어떻게 되었는가"는
      알 수 없습니다. 주문 상태를 묻는 질문은 개별 주문 층이 채워져 있어야 답할 수 있습니다.
