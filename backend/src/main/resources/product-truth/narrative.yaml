# PRODUCT_NARRATIVE — 사람이 직접 관리하는 제품 설명
#
# 왜 이 제품이 있고, 누구를 위한 것이고, 어떻게 쓰이도록 만들어졌는가.
# status도 mode도 evidence도 없다 — 내러티브는 capability 주장을 할 수 없기 때문이다.
# 본문에 capability 주장이 들어가야 한다면 그것은 capabilities.yaml의 행이고,
# 아직 만들지 않은 것이라면 roadmap.yaml의 항목이다.
#
# 여기 적힌 것은 CURRENT_PRODUCT_TRUTH와 충돌할 수 없다. 충돌하면 CURRENT_PRODUCT_TRUTH가 이긴다.
#
# 이미 결정된 제품·UX 방향은 여기가 아니라 direction.yaml 이 소유한다. 바뀔 수 있는 evidence
# (라이브에서 몇 건이 나갔는가 같은 것)도 여기 적지 않는다 — 그것은 capability 행의 근거다.
version: v2
narratives:

  - id: NARRATIVE.WHAT_IT_IS
    title: reviewnary는 판매 후 운영을 맡는 AI 담당자다
    body: >-
      reviewnary는 문의에 답해 주는 챗봇이 아니라, 온라인 판매자의 판매 후 운영을 맡는 AI
      담당자다. 여러 판매 채널에 흩어져 있는 문의·리뷰·상품·주문을 가져와 함께 놓고, 회사가
      등록한 기준을 근거로 무엇을 먼저 봐야 하는지 정리하고, 답변과 조치를 준비한다. 무엇을
      준비할 수 있고 무엇은 준비할 수 없는지는 채널과 객체마다 다르고, 판매자는 확인하고
      결정한다.
    sourceRefs:
      - docs/sellerops_canonical_reference.md
      - docs/product_operating_model.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NARRATIVE.DAILY_LOOP
    title: 하루의 흐름
    body: >-
      수집 → 우선순위와 이상 신호 → 조사 → 답변·조치 준비 → 판매자 확인 → 실행.
      이 순서가 제품의 뼈대다. 각 단계는 앞 단계가 실제로 일어났을 때만 다음으로 넘어간다 —
      가져오지 않은 자료로 우선순위를 매기지 않고, 근거 없이 초안을 쓰지 않고, 승인 없이
      실행하지 않는다.
    sourceRefs:
      - docs/proactive_operations_agent_v1.md
      - docs/core_daily_loop_ux_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NARRATIVE.TARGET_SELLER
    title: 기준 사용자
    body: >-
      기준 사용자는 네이버·쿠팡·자사몰 같은 여러 채널에서 팔고 있는 온라인 판매자와 그 회사의
      운영 담당자다. 개발자가 아니고, 하루 종일 관리자 화면 앞에 앉아 있지도 않다. 그래서 화면은
      지금 상황과 문제와 내가 누를 것을 먼저 보여야 하고, 답변은 판매자가 그대로 쓸 수 있는
      문장이어야 한다.
    sourceRefs:
      - docs/executive_ux_redesign_v1.md
      - docs/reviewnary_design.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NARRATIVE.SELLER_CENTER_DIFFERENCE
    title: 판매자센터와 무엇이 다른가
    body: >-
      판매자센터는 채널마다 하나씩 있고 각자 자기 채널의 자기 화면만 보여 준다. 그래서 판매자는
      문의 화면과 리뷰 화면과 주문 화면을 각각 열어 보고 머릿속에서 잇는다. reviewnary가 다르게
      하는 것은 자료를 한곳에 모으는 것 자체가 아니라, 문의·리뷰·상품·주문과 회사가 등록한 기준을
      함께 놓고 무엇을 확인해야 하는지와 어떤 행동을 준비해 둘지를 판단하는 것이다. 판매자센터가
      답하지 않는 질문 — "오늘 뭐부터 해야 하지", "이게 반복되는 문제인가" — 이 그 자리에 있다.
    sourceRefs:
      - docs/product_operating_model.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NARRATIVE.HUMAN_APPROVAL
    title: 사람의 확인이 제품의 일부다
    body: >-
      고객에게 나가는 문장은 판매자가 확인한 문장이다. reviewnary는 초안을 준비하고 무엇을
      근거로 썼는지 보여 주지만, 승인은 사람이 한다. 판매자가 초안을 고쳐 쓰면 나가는 것은 고쳐
      쓴 문장이고, 승인 전에는 어떤 문장도 화면 밖으로 나가지 않는다.
    sourceRefs:
      - docs/pilot_runtime_foundation_v1.md §0-A
      - INVARIANT.APPROVAL_BOUNDARY
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NARRATIVE.OPERATING_PRINCIPLES
    title: 운영 원칙 — 정직한 부재
    body: >-
      이 제품이 반복해서 지키는 규칙이 있다. 확인하지 않은 것을 "없다"고 말하지 않는다.
      알아보지 못한 값을 그럴듯한 값으로 바꾸지 않는다. 근거가 없으면 초안을 지어내지 않고 무엇이
      빠졌는지 말한다. 채널이 지원하지 않는 것을 "아직 지원하지 않는다"고 말하지 않는다. 이 규칙들
      때문에 답이 짧아지는 경우가 있고, 그것이 옳은 결과다.
    sourceRefs:
      - INVARIANT.ABSENCE
      - docs/answer_applicability_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"
