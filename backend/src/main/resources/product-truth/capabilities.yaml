        status: NOT_SUPPORTED
        mode: NONE
        evidence: DECLARED
        evidenceRef: 수집하지 않는 문의에는 초안 대상이 없음
        sellerFacingNotes:
          - 톡톡 문의에는 초안을 준비하지 않습니다.
    sourceRefs:
