      - com.sellerops.inquiry.draft.InquiryDraftComposer
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NAVER.INQUIRY.EXECUTION
    channel: NAVER
    object: INQUIRY
    axis: EXECUTION
    status: PARTIAL
    mode: DIRECT_WITH_APPROVAL
    evidence: LIVE_PROVEN
    evidenceRef: >-
      상품 문의: `LIVE_VERIFIED` 2026-08-26, commit 692c5a78, 승인 `apr-ce092e823017`
      (PUT /external/v1/contents/qnas/{questionId} 1회 · 재시도 0 · 판정은 NaverAnsweredStateReader
      의 read-back) · docs/pilot_runtime_foundation_v1.md §0-A
    sellerFacingNotes:
      - 판매자님이 승인하시면 reviewnary가 네이버에 답변을 직접 등록하고 등록됐는지 다시 읽어
        확인합니다.
    limitations:
      - 이 행은 세 문의 종류를 묶어 말한 요약입니다. 실제 사실은 subtype 이 정합니다 —
        답변 계약이 종류마다 다르고 톡톡에는 답변 경로가 없습니다.
      - 고객 문의(네이버페이) 답변 경로는 구현돼 있지만 실제 스토어에서 실행된 적이 없습니다.
      - 상품 문의는 같은 문의에 다시 보내면 등록이 아니라 수정으로 동작합니다. 그래서 대상의
        현재 상태를 증명하지 못하면 전송을 경고가 아니라 거절로 막습니다.
      - 두 문의 종류는 식별자 공간이 겹치지 않는 별개 계약이라, 한쪽 승인이 다른 쪽 승인이 되지
        않습니다.
    requirements:
      - kind: VALID_APPROVAL
        description: >-
          판매자님이 그 문의 하나에 대해 승인하신 기록이 있어야 하고, 승인은 한 번만 쓰입니다.
      - kind: CHANNEL_PRECONDITION
        description: >-
          상품 문의는 보내기 직전에 대상의 현재 답변 상태를 다시 읽어 확인할 수 있어야 합니다.
          확인하지 못하면 보내지 않습니다.
    subtypes:
      - key: PRODUCT_INQUIRY
        label: 상품 문의
        status: SUPPORTED
        mode: DIRECT_WITH_APPROVAL
        evidence: LIVE_PROVEN
        evidenceRef: >-
          `LIVE_VERIFIED` 2026-08-26, commit 692c5a78, 승인 `apr-ce092e823017` — 등록 1회 ·
          재시도 0 · 판정은 read-back
        sellerFacingNotes:
          - 상품 문의는 승인 후 reviewnary가 직접 등록하고 다시 읽어 확인합니다.
        limitations:
          - 같은 문의에 다시 보내면 새 답변이 아니라 기존 답변의 수정이 됩니다.
      - key: CUSTOMER_INQUIRY
        label: 고객 문의 (네이버페이)
        status: SUPPORTED
        mode: DIRECT_WITH_APPROVAL
        evidence: IMPLEMENTED
        evidenceRef: >-
          공식 계약 사본 post-v1-pay-merchant-inquiries-inquiryNo-answer.md ·
          NaverCustomerInquiryReplyAdapter — 구현됨, 실제 스토어 미실행
        sellerFacingNotes:
          - 고객 문의 답변 등록 경로가 있습니다.
        limitations:
          - 실제 스토어에서 실행된 적이 없습니다.
          - 중복 답변은 채널이 거부합니다.
      - key: TALKTALK
        label: 톡톡 문의
        status: NOT_SUPPORTED
        mode: NONE
        evidence: DECLARED
        evidenceRef: 톡톡 답변 계약 없음 · 수집 경로도 없음
        sellerFacingNotes:
          - 톡톡 문의에는 답변을 등록하지 않습니다.
    sourceRefs:
      - com.sellerops.inquiry.publish.InquiryReplyCapabilityRegistry
      - docs/inquiry_workflow_completion_v2.md (OVERWRITE_WITHOUT_PROOF)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NAVER.REVIEW.ACQUISITION
    channel: NAVER
    object: REVIEW
    axis: ACQUISITION
    status: SUPPORTED
    mode: SELLER_GUIDED
    evidence: LIVE_PROVEN
    evidenceRef: >-
      docs/evidence/INDEX.md (2026-09-02 NAVER Guided Acquisition E2E — 채팅 → 판매자센터 → 기간 →
      조회 → 판매자 다운로드 → 자동 감지 → ingest → 같은 대화까지 완주)
    sellerFacingNotes:
      - 네이버 리뷰는 판매자센터에서 한 번 확인해 주시면 이어서 가져옵니다.
      - 판매자님이 하실 일은 판매자센터 화면에서 조회하고 내려받는 것까지이고, 그 다음은
        reviewnary가 이어받습니다.
      - 파일로 직접 올리는 방법도 있습니다(FEATURE.MANUAL_FILE_ACQUISITION).
    limitations:
      - 네이버는 판매자용 리뷰 API를 제공하지 않습니다(공식 스마트스토어 관리자 확인, 2024-08-30).
        그래서 사람이 없어도 도는 정기 수집이 이 채널의 리뷰에는 존재하지 않습니다.
      - 판매자센터 목록의 조회 기간 밖에 있는 리뷰는 스크롤로 닿을 수 없습니다. 기간을 넓히는 것은
        판매자님의 조작이고 reviewnary는 그 결과를 감지할 뿐입니다.
    sourceRefs:
      - com.sellerops.collect.AcquisitionPathRegistry (NAVER/REVIEW = EXPORT · LIVE_PROVEN · SELLER_REPEATED)
      - com.sellerops.connector.ChannelApiGapRegistry (NAVER REVIEW_API 없음)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

