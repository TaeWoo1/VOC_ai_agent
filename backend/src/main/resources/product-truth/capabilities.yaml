# CURRENT_PRODUCT_TRUTH — reviewnary가 제품으로서 실제 제공하는 것
#
# 이 파일이 seller-facing capability 문장의 authority다. 코드/registry/runtime env에서 매번
# 역추론하지 않는다. 역추론이 만든 회귀가 이 파일이 존재하는 이유다 — stale registry 하나가
# 라이브 검증된 Coupang 문의 경로를 PARTIAL로 되돌렸고, QA 환경의 실행 플래그 OFF가
# "reviewnary는 직접 전송하지 못합니다"라는 제품 사양처럼 설명됐다.
#
# 여기 없는 것: 지금 이 배포에서 켜져 있는가 · 이 판매자가 연결했는가 · 지금 수집 중인가.
# 그 셋은 runtime overlay(CURRENT_STATE)이고 실행 시점에 계산한다. 이 파일은 플래그를 읽지 않는다.
#
# 읽는 법
#   status  제품이 이 축을 제공하는가          SUPPORTED / PARTIAL / NOT_SUPPORTED / UNKNOWN
#   mode    제공한다면 어떤 모양인가            축마다 허용 값이 다르다 (ProductCapabilityMode)
#   evidence 무엇이 그 주장을 받치는가          LIVE_PROVEN > TEST_PROVEN > IMPLEMENTED > DECLARED > UNKNOWN
#
#   status와 evidence는 다른 축이다. SUPPORTED + IMPLEMENTED는 "제품이 제공하지만 아직 실제
#   판매자 계정에서 돌려 본 적은 없다"이고, NOT_SUPPORTED + DECLARED는 "감사한 벤더 문서가
#   그 기능이 없다고 말한다"이다. 여기 적었다는 이유로 evidence가 올라가지 않는다.
#
#   mode LIMITED_READ는 "부분만 지원"이 아니라 "명시된 경계 안에서 완전히 지원"이다.
#   경계는 limitations에 적는다. 능력 자체가 반쪽이면 status가 PARTIAL이 된다.
#
#   limitations는 절대 주장하면 안 되는 것의 목록이다. 문장을 넓히기 전에 이 줄들을 읽는다.
#
#   requirements 는 EXECUTION 축에만 붙는 실행 전제조건이다. "제품이 이걸 할 수 있다"와
#   "지금 이 판매자·이 배포에서 실행할 수 있다"는 다른 사실이고, 뒤의 것을 앞의 것에 섞으면
#   capability 가 배포 자세로 읽힌다. 전제조건이 안 채워졌다고 status 가 내려가지 않는다.
#
#   subtypes 는 한 채널의 한 객체가 사실은 여러 계약일 때의 세분화다. 판매자에게 보이는 운영
#   객체는 여전히 상위 객체 하나이고, subtype 은 channel/object/axis 를 갖지 않아 3×4×4 격자에
#   들어가지 않는다.
#
# 채널×객체가 아닌 제품 기능은 features.yaml 이 소유한다. 이 파일은 channel 과 object 를
# 요구하므로 파일 업로드·지식·리포트 같은 제품 전체 기능을 구조적으로 담을 수 없다.
#
# review: TODO_REVIEW 는 "사람이 아직 확인하지 않았다"는 뜻이다. 프로그램만 주장한 사실은
# 아직 제품 결정이 아니다.
version: v2
capabilities:

  # ==========================================================================================
  # NAVER · 스마트스토어
  # ==========================================================================================

  - id: NAVER.INQUIRY.ACQUISITION
    channel: NAVER
    object: INQUIRY
    axis: ACQUISITION
    status: PARTIAL
    mode: AUTOMATIC
    evidence: LIVE_PROVEN
    evidenceRef: >-
      docs/naver_inquiry_api_audit_v1.md §8·§9·§16 · docs/evidence/INDEX.md (2026-08-24 —
      source 획득 + routine recurrence 둘 다 CONFIRMED)
    sellerFacingNotes:
      - 네이버 상품 문의와 고객 문의(네이버페이)를 공식 API로 가져올 수 있습니다.
      - 사람이 조작하지 않아도 정해진 주기로 다시 읽는 자동 수집 경로가 있는 채널입니다.
    limitations:
      - 이 행은 세 문의 종류를 묶어 말한 요약입니다. 실제 사실은 subtype 이 정합니다 —
        상품 문의와 고객 문의는 가져오고 톡톡은 가져오지 않으므로, 이 채널의 문의 전체를
        "가져옵니다"라고 말할 수 없습니다.
      - 톡톡 문의는 네이버가 공식 API를 제공하지 않아 가져오지 않습니다. 0건과 같은 뜻이 아닙니다.
      - 2026-06-01 이전 구간은 관측된 적이 없습니다.
      - 라이브에서 관측된 18건이 전부 답변 완료였으므로, 미답변 문의가 큐에 올라오는 경로는
        아직 실제로 확인되지 않았습니다.
    subtypes:
      - key: PRODUCT_INQUIRY
        label: 상품 문의
        status: SUPPORTED
        mode: AUTOMATIC
        evidence: LIVE_PROVEN
        evidenceRef: >-
          docs/naver_inquiry_api_audit_v1.md §8·§16 (2026-08-24 — 13건 수집 · 오류 0 ·
          채널상품번호 13/13 일치) · routine recurrence CONFIRMED
        sellerFacingNotes:
          - 상품 문의는 공식 API로 가져오고 정기 수집도 가능합니다.
      - key: CUSTOMER_INQUIRY
        label: 고객 문의 (네이버페이)
        status: SUPPORTED
        mode: AUTOMATIC
        evidence: LIVE_PROVEN
        evidenceRef: docs/naver_inquiry_api_audit_v1.md §9 (2026-08-24 — 5건 수집 · 오류 0)
        sellerFacingNotes:
          - 네이버페이 고객 문의도 공식 API로 가져옵니다.
        limitations:
          - 상품 문의와 식별자 공간이 겹치지 않는 별개 계약입니다.
      - key: TALKTALK
        label: 톡톡 문의
        status: NOT_SUPPORTED
        mode: NONE
        evidence: DECLARED
        evidenceRef: >-
          네이버 커머스 API에 판매자용 톡톡 조회 계약이 없음 (감사 결과, 우회 경로도 만들지 않음)
        sellerFacingNotes:
          - 톡톡 문의는 가져오지 않습니다. 톡톡에 온 문의가 0건이라는 뜻이 아닙니다.
    sourceRefs:
      - docs/multi-channel-connector-roadmap.md §4.1 (NAVER INQUIRY 두 행)
      - com.sellerops.connector.naver.NaverProductQnaClient
      - com.sellerops.connector.naver.NaverCustomerInquiriesClient
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NAVER.INQUIRY.READ
    channel: NAVER
    object: INQUIRY
    axis: READ
    status: PARTIAL
    mode: LIMITED_READ
    evidence: LIVE_PROVEN
    evidenceRef: docs/naver_inquiry_api_audit_v1.md §8·§9 (2026-08-24, 18건 · 오류 0)
    sellerFacingNotes:
      - 문의 내용과 등록일, 답변 여부, 어떤 상품에 대한 문의인지를 읽습니다.
      - 문의는 채널상품번호로 판매자님의 상품에 정확히 연결됩니다(라이브 18/18 일치).
    limitations:
      - 비밀글 여부 필드가 응답에 없습니다. 비밀글 구분을 주장하지 않습니다.
      - 주문 식별자가 응답에 없습니다. 네이버 문의를 특정 주문에 결합하지 않습니다.
      - 고객 식별 정보는 응답에 오더라도 저장하지 않습니다.
      - 이 행은 세 문의 종류를 묶어 말한 요약입니다. 실제 사실은 subtype 이 정합니다 —
        톡톡 문의는 가져오지 않으므로 읽을 것도 없습니다.
    subtypes:
      - key: PRODUCT_INQUIRY
        label: 상품 문의
        status: SUPPORTED
        mode: LIMITED_READ
        evidence: LIVE_PROVEN
        evidenceRef: docs/naver_inquiry_api_audit_v1.md §8 (13건 · 채널상품번호 13/13)
        sellerFacingNotes:
          - 상품 문의는 어떤 상품에 대한 문의인지 정확히 연결됩니다.
      - key: CUSTOMER_INQUIRY
        label: 고객 문의 (네이버페이)
        status: SUPPORTED
        mode: LIMITED_READ
        evidence: LIVE_PROVEN
        evidenceRef: docs/naver_inquiry_api_audit_v1.md §9 (5건)
        sellerFacingNotes:
          - 고객 문의의 본문과 답변 여부를 읽습니다.
        limitations:
          - 상품 결합은 상품 문의와 같은 방식으로 보장되지 않습니다.
      - key: TALKTALK
        label: 톡톡 문의
        status: NOT_SUPPORTED
        mode: NONE
        evidence: DECLARED
        evidenceRef: 수집 경로가 없으므로 읽기 경로도 없음 (NAVER.INQUIRY.ACQUISITION.TALKTALK)
        sellerFacingNotes:
          - 톡톡 문의는 읽지 않습니다.
    sourceRefs:
      - docs/operational_fact_binding_v1.md (주문 참조는 채널이 지목한 것만 저장)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: NAVER.INQUIRY.DRAFT
    channel: NAVER
    object: INQUIRY
    axis: DRAFT
    status: PARTIAL
    mode: DRAFT_PREPARED
    evidence: LIVE_PROVEN
    evidenceRef: >-
      docs/evidence/INDEX.md (2026-08-26, `apr-ce092e823017`) — AI 초안 v1(MODEL) 생성 후
      판매자가 v2(SELLER)로 고쳐 승인
    sellerFacingNotes:
      - 등록된 상품 정보·운영 기준·과거 답변을 근거로 답변 초안을 준비합니다.
      - 근거를 찾지 못하면 초안을 지어내지 않고 무엇이 빠졌는지 말합니다.
    limitations:
      - 초안은 답변이 아닙니다. 판매자님이 확인하고 승인하기 전에는 아무 데도 가지 않습니다.
      - 실제로 나간 문장은 AI 초안이 아니라 판매자님이 고쳐 쓴 문장일 수 있습니다.
      - 이 행은 세 문의 종류를 묶어 말한 요약입니다. 실제 사실은 subtype 이 정합니다 —
        가져오지 않는 톡톡 문의에는 초안도 없습니다.
    subtypes:
      - key: PRODUCT_INQUIRY
        label: 상품 문의
        status: SUPPORTED
        mode: DRAFT_PREPARED
        evidence: LIVE_PROVEN
        evidenceRef: docs/evidence/INDEX.md (2026-08-26, `apr-ce092e823017`)
        sellerFacingNotes:
          - 상품 문의 답변 초안을 준비합니다.
      - key: CUSTOMER_INQUIRY
        label: 고객 문의 (네이버페이)
        status: SUPPORTED
        mode: DRAFT_PREPARED
