# PRODUCT_DIRECTION — 이미 결정된 제품·UX 방향
#
# 현재 기능(capabilities/features)도 아니고 로드맵 가설도 아닌 층이다. "홈은 command center 다"는
# 판매자에게 "이 제품은 이걸 해 드립니다"라고 말할 수 있는 capability 가 아니고, 그렇다고 아직
# 정하지 않은 방향도 아니다 — 다음에 무엇을 만들지를 구속하는 결정이다.
#
# 내러티브에 두면 내러티브가 조용히 capability 주장을 하게 되고, 로드맵에 두면 이미 내린 결정이
# 열린 질문처럼 읽힌다. 그래서 자기 층을 갖는다.
#
# ProductDirection 에는 status 도 mode 도 evidence 도 없다. 제품이 제공하는 것으로 읽힐 수 없다.
version: v1
directions:

  - id: DIRECTION.CHAT_FIRST_NOT_CHAT_ONLY
    title: chat-first이지만 chat-only가 아니다
    statement: >-
      주 상호작용은 AI 운영 담당자와의 대화다. 다만 대화는 의도를 나르고, 실제 일은 그 일을 이미
      소유한 구조화된 화면이 보여 준다. 모든 화면에 채팅을 복제하지 않고, 반대로 목록·초안·승인을
      대화 안으로 끌어들이지도 않는다.
    sourceRefs:
      - docs/agent_command_center_v1.md
      - docs/chat_first_agent_shell_v1.md
      - INVARIANT.CONVERSATION_LANE
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: DIRECTION.HOME_COMMAND_CENTER
    title: 홈은 빈 채팅 화면이 아니라 오늘의 운영 상황이다
    statement: >-
      홈은 오늘 무엇이 기다리고 있는지, 무엇이 준비돼 있는지를 먼저 말하고 그 다음에 물어볼 자리를
      준다. 인사말이 아니라 브리핑이 헤드라인이고, 숫자는 그 아래에 있다. 처음 들어온 판매자에게는
      기다리는 일의 수가 아직 사실이 아니므로 세지 않고 다음 걸음 하나를 말한다.
    sourceRefs:
      - docs/agent_command_center_v1.md
      - docs/disconnected_channel_onboarding_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: DIRECTION.OBJECT_BACKED_UI
    title: 답변은 산문이 아니라 객체로 착지한다
    statement: >-
      목록·카드·그래프·초안·승인은 문장을 다시 읽어 만들지 않고, 그 일을 소유한 화면의 객체를
      그대로 쓴다. 숫자는 그것을 센 한 곳에서만 오고, 화면이 같은 사실을 두 번 말하지 않으며,
      0은 문이 되지 않는다. 판매자가 누를 수 있는 것과 볼 수 있는 것이 같은 객체를 가리킨다.
    sourceRefs:
      - docs/reviewnary_design.md
      - docs/operational_workspace_ux_v1.md
      - docs/product_operations_continuity_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: DIRECTION.AGENT_OPERATING_ARC
    title: 관찰 → 조사 → 판단 → 준비 순으로 발전한다
    statement: >-
      Agent 는 물어보면 조회해 주는 창구에서, 관찰하고 조사하고 무엇이 문제인지 판단하고 다음
      행동까지 준비해 두는 담당자로 발전한다. 각 단계는 앞 단계가 실제로 일어났을 때만 다음으로
      간다. 실행은 이 축의 끝이 아니라 승인 뒤에 오는 별도 경로다.
    sourceRefs:
      - docs/proactive_operations_agent_v1.md
      - docs/agent_procedure_layer_v1.md
      - INVARIANT.APPROVAL_BOUNDARY
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"
