# ROADMAP — 방향이지 기능이 아니다
#
# 이 파일의 어떤 항목도 현재 capability가 아니다. 구조로 그렇다 — ProductRoadmapItem에는
# status(capability)도 mode도 evidence도 없고, ProductCapability와 공통 상위 타입도 없다.
# 두 목록을 한꺼번에 도는 호출자가 존재할 수 없다.
#
# qualifier는 이 항목을 언급하는 답변이 반드시 함께 실어야 하는 한정어다. 비워 둘 수 없다.
#
# 여기 있는 것은 '아직 하지 않은 것'이다. '이미 정한 방식'은 direction.yaml 이고, 배포 인프라
# 작업은 제품 로드맵이 아니라 운영 작업이라 이 파일에서 다루지 않는다.
#
# 항목은 판매자에게 말할 수 있는 가치로 적는다. 내부 구현 방식이 항목의 제목이면 그 항목은
# 판매자 질문에 인용될 수 없다.
version: v2
roadmap:

  - id: ROADMAP.PRODUCT_DETAIL_KNOWLEDGE
    title: 상품 상세페이지에 적힌 내용을 답변 근거로 쓰기
    status: EXPLORING
    summary: >-
      판매자가 상세페이지에 이미 적어 둔 규격을 — 글이든 그림이든 — 읽어 답변의 근거로 쓰는 방향.
      판매자가 지식을 다시 입력하지 않아도 되는 것이 가치다. 두 경로 모두 기본값 OFF이고, 그림
      경로는 기술 검증만 끝났으며(추출 48건) 판매자 화면에 반영된 것은 0건이다. 글 경로는 아직
      실제로 돈 적이 없다. 판매자 이미지 원본이 모델로 나가는 것이 payload 성질을 바꾸기 때문에
      착수는 제품 오너 결정이다.
    qualifier: 현재 판매자님 화면에 반영되는 기능이 아니며 아직 검토 단계입니다.
    sourceRefs:
      - docs/image_product_knowledge_v1.md §10·§11
      - docs/knowledge_gap_resolution_v1.md (rollout DEFERRED)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.OPERATIONAL_KNOWLEDGE
    title: 회사 운영 기준을 조건까지 구분해서 적용하기
    status: EXPLORING
    summary: >-
      배송·교환·반품 같은 운영 기준은 상품 FAQ와 다르다. 지역·금액·기간·상품군에 따라 답이 달라지고,
      지금은 그 조건을 글 안에 문장으로 적어 두는 수밖에 없어 "이 고객에게 해당되는가"를 시스템이
      판단하지 못한다. 조건을 구분해서 담고 그 질문에 맞는 기준만 골라 쓰는 방향이다.
    qualifier: 현재 제공되는 기능이 아니며 아직 구현하지 않은 방향입니다.
    sourceRefs:
      - docs/operational_knowledge_direction_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.ORDER_LINE_ITEMS
    title: 주문과 상품을 라인 단위로 잇기
    status: EXPLORING
    summary: >-
      주문 화면이 "어떤 상품이 얼마나 팔렸는가"에 답하려면 주문 라인이 필요한데, 현재 저장하는
      주문 행에는 상품 식별자도 라인도 없다. 필요한 것은 UI가 아니라 데이터이며, 네이버
      lastChangedType 확대와 주문↔상품 연결이 선행되어야 한다.
    qualifier: 현재 제공되는 기능이 아니며 아직 결정되지 않은 방향입니다.
    sourceRefs:
      - docs/secondary_workspaces_ux_closure_v1.md §2
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.ANSWER_STYLE_EXEMPLAR
    title: 판매자의 과거 답변을 말투 예시로 쓰기
    status: NOT_COMMITTED
    summary: >-
      판매자가 실제로 쓴 답변을 답변 말투의 예시로 재사용하는 경로. 코드 자리는 있으나 호출자가
      0이고 그 사실이 테스트로 고정돼 있다. 지금 정해져 있는 것은 자동 학습을 켜 두지 않는다는
      것뿐이고, 판매자가 예시를 직접 고르는 형태로 도입할지는 정해지지 않았다.
    qualifier: 현재 제공되는 기능이 아니며 도입하기로 확정된 항목도 아닙니다.
    sourceRefs:
      - docs/organization_answer_style_v1.md (usableAsExemplar — caller 0)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.CUSTOMER_TIMELINE
    title: 한 고객의 판매 후 이력을 이어서 보기
    status: EXPLORING
    summary: >-
      한 고객의 주문 · 배송 · 문의 · 리뷰 · 반품을 시간순으로 이어 붙여, 지금 이 문의나 이 리뷰가
      어떤 이력 위에 있는지 보이게 하는 방향. 지금은 문의는 문의대로 리뷰는 리뷰대로 읽히고,
      채널이 문의에 주문을 지목한 경우에만 그 주문 하나가 결합된다. 배송과 반품은 저장하는 주문
      행에 아예 없고, 고객 식별을 어디까지 저장할 것인가도 먼저 정해져야 해서 결정된 것이 없다.
    qualifier: 현재 제공되는 기능이 아니며 아직 결정되지 않은 방향입니다.
    sourceRefs:
      - docs/operational_fact_binding_v1.md
      - INVARIANT.ORDER_SCOPE
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.OPPORTUNITY_ENGINE
    title: 지금 할 만한 고객 행동을 찾아 제안하고 준비하기
    status: EXPLORING
    summary: >-
      고객 이력(ROADMAP.CUSTOMER_TIMELINE)과 운영 맥락을 바탕으로, 지금 이 고객에게 할 만한 행동이
      무엇인지 찾아 제안하고 그 행동을 준비해 두는 방향. 현재의 개선 기회는 반복되는 리뷰 문제
      하나에서 나오는 상품 개선 제안이고(FEATURE.IMPROVEMENT_OPPORTUNITY), 이것은 고객 단위의
      다른 질문이다. 무엇을 제안해도 실행은 판매자의 승인 뒤이며, 그 경계는 이 방향에서도 바뀌지
      않는다.
    qualifier: 현재 제공되는 기능이 아니며 아직 결정되지 않은 확장 방향입니다.
    sourceRefs:
      - docs/opportunity_engine_v1.md
      - FEATURE.IMPROVEMENT_OPPORTUNITY
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.REVIEW_OPPORTUNITY
    title: 리뷰를 요청할 대상과 시점을 찾아 준비하기
    status: EXPLORING
    summary: >-
      배송이 끝났는데 아직 리뷰를 남기지 않은 고객을 찾고, 진행 중인 문의나 반품·배송 지연 같은
      맥락을 함께 보아 지금 요청해도 되는 대상과 시점을 추천하고 보낼 문장을 준비하는 방향.
      이미 있는 개선 기회(FEATURE.IMPROVEMENT_OPPORTUNITY)와는 다른 것이다 — 그쪽은 이미 쌓인
      리뷰에서 반복되는 문제를 찾아 상품 보완을 제안하고, 이쪽은 아직 없는 리뷰를 요청한다.
      배송 완료 여부도 리뷰 미작성 여부도 지금 저장하는 데이터로는 판단할 수 없다는 것이 선행
      조건이고, 고객에게 나가는 문장이므로 승인 경계도 함께 정해져야 한다.
    qualifier: 현재 제공되는 기능이 아니며 아직 결정되지 않은 확장 방향입니다.
    sourceRefs:
      - INVARIANT.ORDER_SCOPE (배송 상세와 주문 라인을 저장하지 않는다)
      - INVARIANT.APPROVAL_BOUNDARY
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.CHANNEL_EXPANSION
    title: 판매 채널 확대
    status: NOT_COMMITTED
    summary: >-
      지금은 네이버·쿠팡·카페24 세 채널에 집중한다(2026-08-17 제품 오너 결정). 화면에 있는 채널은
      실제로 쓸 수 있는 채널이어야 한다는 규칙이 그 이유이고, 11번가·ESM+·SSG·오늘의집은 인증
      골격이나 파일 업로드까지만 존재한다. 어떤 채널을 언제 더할지는 확정되지 않았다.
    qualifier: >-
      현재는 네이버·쿠팡·카페24를 지원하며, 추가 채널과 일정은 아직 확정되지 않았습니다.
    sourceRefs:
      - docs/product_assembly_ia_v1.md
      - com.sellerops.channel.ProductChannels (VISIBLE_CODES)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: ROADMAP.TEAM_ACCESS
    title: 직원과 함께 쓰기 — 초대와 역할·권한
    status: NOT_COMMITTED
    summary: >-
      한 회사에서 여러 사람이 함께 쓰고, 누가 무엇을 할 수 있는지 정하는 방향. 지금은 가입하면
      회사가 하나 만들어지고 그 계정만 자료를 봅니다 — 직원을 초대하거나 이미 있는 회사에
      합류하는 경로가 없습니다. 제품 범위 문서가 여러 사용자와 역할·권한 세분화를 v1 범위 밖으로
      정해 두었고, 언제 어떤 형태로 도입할지는 정해지지 않았습니다.
    qualifier: 현재 제공되는 기능이 아니며 도입 여부와 일정도 아직 확정되지 않았습니다.
    sourceRefs:
      - docs/product-scope-v1.md (멀티유저 RBAC — v1 범위 밖)
      - FEATURE.ACCOUNT_AND_ORGANIZATION
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"
