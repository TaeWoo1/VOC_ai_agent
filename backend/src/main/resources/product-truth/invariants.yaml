# CURRENT_PRODUCT_TRUTH — 채널×객체가 아닌 제품 전체의 사실
#
# capabilities.yaml이 "이 채널의 이 객체에 대해 무엇을 하는가"를 답한다면, 이 파일은 어디에서나
# 참인 것을 답한다. 채널을 비워 둔 capability가 아니라 다른 종류의 진술이라, axis도 mode도 없다.
#
# notThis는 이 불변식이 명시적으로 말하지 '않는' 것이다. QA에서 실제로 관측된 과도한 일반화를
# 그대로 적어 둔다 — 문장을 넓히기 전에 읽는 목록이다.
version: v2
invariants:

  - id: INVARIANT.CAPABILITY_VS_STATE
    title: 제품 capability와 현재 상태는 다른 사실이다
    statement: >-
      "reviewnary가 무엇을 할 수 있는 제품인가"와 "지금 이 배포에서 켜져 있는가 · 이 판매자가
      연결했는가 · 지금 수집이 돌고 있는가"는 서로 다른 질문이다. 앞의 것은 현재 제품 기준이 답하고,
      뒤의 것은 실행 시점에 계산해서 그 위에 덧붙인다. 판매자에게는 둘 다 말하되 한 문장에
      섞지 않는다 — "카페24 문의 답변은 판매자 승인 후 직접 등록할 수 있습니다. 다만 지금 이
      환경에서는 직접 등록이 꺼져 있어 초안까지만 가능합니다."
    notThis:
      - 실행 플래그가 꺼져 있다는 이유로 제품 capability를 PREPARE_ONLY로 낮추지 않는다.
      - 판매자가 아직 연결하지 않았다는 이유로 채널의 capability를 UNKNOWN으로 낮추지 않는다.
      - 내부 설정 키 이름을 판매자에게 말하지 않는다.
    sourceRefs:
      - docs/grounded_conversation_lane_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.OPERATING_OBJECTS
    title: 채널 운영의 핵심 데이터 객체는 문의·리뷰·상품·주문이다
    statement: >-
      reviewnary가 판매 채널에서 가져와 운영하는 데이터 객체는 문의·리뷰·상품·주문 네 가지다.
      매출은 별도 객체가 아니라 주문에서 파생된다. 이것은 채널에서 가져오는 것의 목록이지 제품이
      하는 일의 목록이 아니다 — 파일 업로드, 회사 지식, 과거 답변, 답변 말투, 리포트, 개선 기회,
      선제 조사는 채널×객체로 나뉘지 않는 제품 기능이다.
    notThis:
      - >-
        "이 네 가지밖에 하지 않는다"고 말하지 않는다. 채널×객체로 나뉘지 않는 제품 기능들도 이
        제품이 하는 일이다.
      - >-
        "다루는 영역은 문의·리뷰·상품·주문뿐"처럼 배타적으로 말하지 않는다.
      - 네 객체를 한 덩어리로 말하지 않는다. 채널마다 객체마다 할 수 있는 일이 다르다.
      - 한 객체 안의 종류 차이를 뭉개지 않는다. 네이버 문의는 상품 문의·고객 문의·톡톡이 서로 다른
        계약이고, 상위 행 하나로 셋을 대신 말하지 않는다.
    sourceRefs:
      - agent-runtime/src/operator/capability/ProductTruth.ts (OPERATING_OBJECTS)
      - features.yaml
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.APPROVAL_BOUNDARY
    title: 외부에 영향을 주는 일은 판매자 확인 없이 실행하지 않는다
    statement: >-
      외부 고객이나 판매 채널에 영향을 주는 작업은 판매자 확인 없이 실행하지 않는다. 확인 후 직접
      처리할 수 있는 작업과 판매자가 마지막 단계를 완료해야 하는 작업은 채널별로 다르다.
    notThis:
      - >-
        "저는 직접 보내거나 수정하지 않습니다"처럼 제품 전체가 읽기 전용인 것처럼 말하지 않는다.
        승인 후 직접 등록하는 경로가 실재한다(카페24 문의 · 네이버 상품 문의는 라이브 검증됨).
      - 반대로 "승인하시면 다 보내 드립니다"라고도 말하지 않는다. 네이버 리뷰는 마지막 등록 버튼을
        판매자가 누르고, 쿠팡 리뷰는 답을 남길 기능 자체가 없다.
    sourceRefs:
      - docs/sellerops_live_approval_contract.md
      - capabilities.yaml (각 채널×객체의 EXECUTION 행)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.CONVERSATION_LANE
    title: 대화 창구와 외부 전송은 같은 경계가 아니다
    statement: >-
      대화에서 하는 일은 읽고, 조사하고, 설명하고, 다음 할 일을 정리하고, 필요한 작업을 준비해
      화면으로 넘기는 데까지다. 즉 대화는 일을 진행시킬 수 있다. 다만 외부 고객이나 판매 채널에
      실제로 나가는 등록은 대화가 하지 않는다 — 그것은 판매자가 승인한 뒤 별도 실행 경로에서
      일어난다.
    notThis:
      - 대화 창구의 경계를 제품 전체의 경계처럼 말하지 않는다. "이 대화 창구에서는"과
        "reviewnary는"은 다른 주어다.
      - 대화가 조회만 한다고 말하지 않는다. 조사하고 판단하고 준비하는 것도 대화가 하는 일이다.
      - 반대로 대화에서 승인이나 전송이 일어난다고 말하지 않는다. 승인은 그 일을 소유한 화면의 것이다.
    sourceRefs:
      - agent-runtime/src/operator/capability/AssistantCapability.ts
      - docs/grounded_conversation_lane_v1.md §4 (대화 turn은 어떤 procedure도 진행시키지 않는다)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.READ_ONLY_OBJECTS
    title: 상품과 주문은 읽고 근거로 쓰는 대상이다
    statement: >-
      상품과 주문은 가져와서 읽고, 답변의 근거로 쓴다. reviewnary가 판매 채널의 상품 정보를
      고치거나 주문을 수정·취소·발송 처리하지 않는다.
    notThis:
      - >-
        "상품 관리를 해 드립니다"라고 말하지 않는다.
      - 이것을 "제품 전체가 읽기 전용"으로 확대하지 않는다. 문의와 리뷰에는 실행 경로가 있다.
    sourceRefs:
      - agent-runtime/test/operator/operatorToolRegistry.test.ts
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.ORDER_SCOPE
    title: 주문에서 답할 수 있는 것은 건수·매출 흐름·채널별 집계다
    statement: >-
      주문은 기간별 건수, 매출 흐름, 채널별 집계를 답한다. 단건 정확 조회는 카페24에만 있고, 고객이
      문의에서 주문을 지목했을 때 문의 상세와 답변 초안에서만 실행된다.
    notThis:
      - 주문의 상품 구성(라인 아이템)은 답하지 않는다 — 어느 채널에서도 저장하지 않는다.
      - 배송 상세나 배송 상태 관리는 답하지 않는다 — 주문 상태 어휘는 관측된 값뿐이다.
      - 고객 정보는 답하지 않는다.
      - 주문 수정·취소·발송 처리는 하지 않는다.
      - 집계의 최신성만으로 개별 주문의 최신 상태를 말하지 않는다.
    sourceRefs:
      - docs/operational_fact_binding_v1.md
      - docs/exact_operational_context_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.KNOWLEDGE_SCOPE
    title: 지식 검색과 운영 맥락 조회는 서로 다른 경로다
    statement: >-
      답변을 준비할 때 쓰는 근거는 두 종류이고 오는 길이 다르다. 하나는 회사가 등록한 지식 —
      상품 정보와 FAQ, 운영 기준과 답변 기준, 판매자가 실제로 했던 과거 답변, 회사 소개 — 이고,
      이것이 검색되는 코퍼스다. 다른 하나는 연결된 채널의 운영 데이터 — 이 문의가 어떤 상품에
      대한 것인가, 지목된 주문이 어떤 상태인가 같은 것 — 이고, 이것은 검색하지 않고 그 사실을
      소유한 곳에서 그때 정확히 읽는다. 답변은 둘 다 쓸 수 있지만 같은 방식으로 얻지 않는다.
    notThis:
      - 리뷰·주문·문의 전체가 검색 코퍼스인 것처럼 말하지 않는다. 채널 사실과 주문 상태는 검색
        코퍼스를 갖지 않고 결정론적 출처에서 그때 읽는다.
      - 반대로 "채널 데이터는 근거로 쓰지 않는다"고도 말하지 않는다. 경로가 다를 뿐 둘 다 근거다.
      - AI가 만든 초안이 과거 답변 기억에 들어간다고 말하지 않는다. 구조적으로 들어가지 않는다.
    sourceRefs:
      - docs/seller_operations_knowledge_and_answer_memory_v1.md
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.DATA_BOUNDARY
    title: 다른 회사의 자료는 보지 못한다
    statement: >-
      다른 회사의 비공개 자료는 보지 못한다. 이 회사가 연결한 채널의 자료와 이 회사가 등록한 지식은
      쓸 수 있다.
    notThis:
      - >-
        "채널 밖의 자료는 아무것도 보지 못한다"고 말하지 않는다. 판매자님이 직접 등록하신 운영
        기준·FAQ·회사 정보는 채널에서 온 것이 아니지만 쓸 수 있다.
    sourceRefs:
      - docs/seller_operations_knowledge_and_answer_memory_v1.md (KnowledgeScope)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.ABSENCE
    title: 확인하지 않은 것과 없는 것은 다르다
    statement: >-
      "없습니다"는 실제로 세어 본 뒤에만 할 수 있는 말이다. 읽지 못했거나 아직 가져오지 않은 것은
      "없다"가 아니라 "아직 확인하지 못했다"이다.
    notThis:
      - 응답에서 사라진 것을 삭제로 판정하지 않는다.
      - 알아보지 못한 값을 그럴듯한 값으로 바꾸지 않는다.
    sourceRefs:
      - docs/agent_procedure_layer_v1.md (AbsenceReason · ZERO_MEASURED)
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.ORG_ISOLATION
    title: 조회는 로그인한 계정의 회사로 한정된다
    statement: >-
      제품의 모든 조회는 로그인한 계정이 속한 회사를 기준으로 한다. 어느 회사의 자료를 볼지는
      로그인 정보가 정하고, 요청을 보내는 쪽이 고르지 않는다. 로그인하지 않은 요청은 인증과
      채널 연결 콜백을 빼면 어떤 자료에도 닿지 못한다.
    notThis:
      - >-
        "구조적으로 다른 회사의 자료에 닿는 것이 불가능하다"고 말하지 않는다. 조회가 그렇게 쓰여
        있고 테스트가 그것을 지키는 것이지, 데이터베이스가 막고 있는 것이 아니다.
      - >-
        이 항목을 회사 자료 전반의 보안 보증으로 넓히지 않는다. 여기서 말하는 것은 조회 범위
        하나다.
    sourceRefs:
      - com.sellerops.config.SecurityConfig (anyRequest().authenticated())
      - 다른 조직의 식별자가 조회되지 않음을 확인하는 백엔드 테스트 42개 파일
      - INVARIANT.DATA_BOUNDARY
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"

  - id: INVARIANT.SECURITY_CLAIM_LIMIT
    title: 보안에 대해서는 확인된 것까지만 말한다
    statement: >-
      보안을 물으면 확인할 수 있는 것만 답한다 — 로그인해야 자료를 볼 수 있다는 것, 조회가 그
      회사로 한정된다는 것, 채널 연결 자격을 암호화해서 보관한다는 것, 도우미가 별도 연결로
      붙는다는 것. 그 밖의 것은 배포와 운영이 정하는 사실이거나 현재 제품 기준으로 확인되지 않는
      것이므로, 모른다고 말하는 편이 정확하다.
    notThis:
      - >-
        회사 자료 전체가 암호화되어 보관된다고 말하지 않는다. 확인되는 것은 채널 연결 자격
        하나다(FEATURE.CHANNEL_CREDENTIAL_STORAGE).
      - 백업이 있고 복구된다고 말하지 않는다. 자료를 얼마나 보관하는지도 말하지 않는다.
      - 판매자가 자료나 계정을 스스로 지울 수 있다고 말하지 않는다.
      - 통신 구간 보호는 배포가 정하는 사실이므로 제품의 보증으로 말하지 않는다.
      - >-
        개인정보를 어떻게 다루는지에 대한 일반적인 답을 지어내지 않는다. 채널마다 다르고, 이
        현재 제품 기준에 적힌 채널에 대해서만 말할 수 있다.
    sourceRefs:
      - FEATURE.CHANNEL_CREDENTIAL_STORAGE
      - INVARIANT.ORG_ISOLATION
      - INVARIANT.ABSENCE
    review: HUMAN_REVIEWED
    lastReviewed: "2026-09-08"
