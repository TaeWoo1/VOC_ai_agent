# Offline test DB: H2 in PostgreSQL-compatibility mode, schema from entities
# (Flyway disabled so the Postgres migrations don't run against H2).
spring.datasource.url=jdbc:h2:mem:sellerops_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only HMAC secret for the ESM import preview token (never a production value).
sellerops.inquiry-import.preview-token.secret=test-only-esm-inquiry-import-preview-secret
