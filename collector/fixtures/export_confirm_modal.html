<!doctype html>
<!--
  SYNTHETIC stand-in for the confirmation/warning modal shown AFTER the export
  click. Offers a safe confirm (확인) and a cancel (취소). The collector must click
  only the safe confirm, then the download proceeds. No real NAVER DOM / PII.
-->
<html lang="ko">
  <head><title>리뷰 관리</title></head>
  <body>
    <div id="seller-gnb">판매자센터</div>
    <main>
      <h1>리뷰 조회</h1>
      <div role="dialog" aria-modal="true" class="export-confirm">
        <p>리뷰 데이터를 내려받으시겠습니까? 개인정보가 포함될 수 있습니다.</p>
        <button type="button" class="cancel">취소</button>
        <button type="button" class="confirm">확인</button>
      </div>
    </main>
  </body>
</html>
