<!doctype html>
<!--
  SYNTHETIC stand-in for the class-based confirmation modal NAVER's export uses
  (Bootstrap/Angular-style markup, NO ARIA role). Structurally mirrors the observed
  shape — .modal-dialog / .modal-content / .modal-body / .modal-footer /
  .seller-btn-area, a default 취소 button and a primary 확인 button — without copying
  any real NAVER DOM. The collector must scope the confirm click to the visible
  modal container and click only the primary 확인. No real NAVER DOM / PII.
-->
<html lang="ko">
  <head><title>리뷰 관리</title></head>
  <body>
    <div id="seller-gnb">판매자센터</div>
    <main>
      <h1>리뷰 조회</h1>
      <div class="modal-dialog modal-md">
        <div class="modal-content">
          <div class="modal-body">
            <p>리뷰 데이터를 내려받으시겠습니까? 개인정보가 포함될 수 있습니다.</p>
          </div>
          <div class="modal-footer">
            <div class="seller-btn-area">
              <button type="button" class="btn btn-default">취소</button>
              <button type="button" class="btn btn-primary" ng-click="ok()">확인</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
