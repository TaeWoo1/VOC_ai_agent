<!doctype html>
<!--
  SYNTHETIC stand-in for a gated export: the only export-wording control is
  DISABLED (e.g. until a search/date-range query runs). A disabled control is not
  actionable, so the classifier must NOT treat it as a sync trigger and the run
  must not click it → UNRECOGNIZED. No real NAVER DOM / PII.
-->
<html lang="ko">
  <head><title>리뷰 관리</title></head>
  <body>
    <div id="seller-gnb">판매자센터</div>
    <main>
      <h1>리뷰 조회</h1>
      <section class="filters">
        <input type="date" name="from" />
        <input type="date" name="to" />
        <button type="submit">조회</button>
      </section>
      <button type="button" class="excel-btn" disabled>리뷰 엑셀 내려받기</button>
    </main>
  </body>
</html>
