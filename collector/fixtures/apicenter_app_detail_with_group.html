<!doctype html>
<!-- Synthetic API-center application detail with editable fields and an API group already present. -->
<html lang="ko">
  <head><title>애플리케이션 상세</title></head>
  <body>
    <form class="app-detail">
      <input type="text" name="appName" />
      <input type="text" name="serviceUrl" />
      <ul class="api-groups">
        <li>커머스 API</li>
        <li>상품 API</li>
      </ul>
      <button data-aw-target="api_group" type="button">API 그룹 관리</button>
    </form>
  </body>
</html>
