<!doctype html>
<!-- Synthetic API-center issued-credentials page: readonly fields DISPLAY the Application ID / Secret.
     The runtime NEVER reads their values — only the presence/readonly-ness classifies the page. -->
<html lang="ko">
  <head><title>발급 정보</title></head>
  <body>
    <section class="credentials" data-aw-target="credentials">
      <label>애플리케이션 ID</label>
      <input type="text" readonly value="" />
      <label>애플리케이션 시크릿</label>
      <input type="text" readonly value="" />
    </section>
    <a data-aw-target="return" href="#">SellerOps로 돌아가기</a>
  </body>
</html>
