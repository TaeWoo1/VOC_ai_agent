<!doctype html>
<!-- Synthetic API-center applications list with NO application (empty state). List-like container present
     (header + empty-state row) so it classifies as app_list; zero application-entry rows. -->
<html lang="ko">
  <head><title>내 애플리케이션</title></head>
  <body>
    <main>
      <ul class="app-list">
        <li class="app-list-head">애플리케이션</li>
        <li class="app-list-empty">등록된 애플리케이션이 없습니다.</li>
      </ul>
      <button data-aw-target="create_app" type="button">애플리케이션 등록</button>
    </main>
  </body>
</html>
