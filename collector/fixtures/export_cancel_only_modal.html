<!doctype html>
<!--
  SYNTHETIC stand-in for a modal that offers NO safe confirm action — only cancel /
  close. The collector must not click any of these and must halt as DOWNLOAD_FAILED
  rather than guess at an unrelated control. No real NAVER DOM / PII.
-->
<html lang="ko">
  <head><title>리뷰 관리</title></head>
  <body>
    <div id="seller-gnb">판매자센터</div>
    <main>
      <h1>리뷰 조회</h1>
      <div role="dialog" aria-modal="true" class="export-blocked">
        <p>현재 내려받기를 사용할 수 없습니다.</p>
        <button type="button" class="cancel">취소</button>
        <button type="button" class="close" aria-label="닫기">닫기</button>
      </div>
    </main>
  </body>
</html>
