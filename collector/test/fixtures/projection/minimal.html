<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Projection Fixture — Minimal</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    background: #10131a;
    color: #e6e9ef;
    width: 1000px;
    height: 560px;
    position: relative;
  }
  #top {
    position: absolute;
    left: 20px;
    top: 20px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  #txt {
    width: 240px;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #3a4152;
    border-radius: 6px;
    background: #1b2030;
    color: #e6e9ef;
  }
  #pop {
    padding: 8px 14px;
    font-size: 14px;
    border: 0;
    border-radius: 6px;
    background: #4f7cff;
    color: #fff;
    cursor: pointer;
  }
  #target {
    position: absolute;
    left: 600px;
    top: 300px;
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, #ff5d73, #ffb45d);
    border: 2px solid #fff;
    border-radius: 8px;
    box-sizing: border-box;
  }
  #barTrack {
    position: absolute;
    left: 20px;
    top: 80px;
    width: 960px;
    height: 14px;
    background: #1b2030;
    border-radius: 7px;
    overflow: hidden;
  }
  #bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 120px;
    height: 14px;
    background: linear-gradient(90deg, #34d399, #4f7cff);
    border-radius: 7px;
  }
  #noise {
    position: absolute;
    left: 0;
    top: 0;
  }
  #hint {
    position: absolute;
    left: 20px;
    bottom: 16px;
    font-size: 12px;
    color: #7b8497;
  }
</style>
</head>
<body>
  <div id="top">
    <input id="txt" type="text" placeholder="입력 필드" autocomplete="off">
    <button id="pop" type="button">팝업 열기</button>
  </div>

  <div id="barTrack"><div id="bar"></div></div>

  <div id="target"></div>

  <canvas id="noise" width="1000" height="560" style="display:none;"></canvas>

  <div id="hint">최소 상호작용 픽스처</div>

<script>
  window.__lastClick = null;
  window.__lastKey = null;
  window.__hidden = false;
  window.__typed = "";

  var txt = document.getElementById("txt");
  txt.addEventListener("input", function (e) {
    window.__typed = e.target.value;
  });

  document.getElementById("pop").addEventListener("click", function () {
    window.open("popup.html", "_blank", "width=400,height=300");
  });

  var canvas = document.getElementById("noise");
  var ctx = canvas.getContext("2d");

  function drawNoise() {
    canvas.style.display = "block";
    var w = canvas.width;
    var h = canvas.height;
    var img = ctx.createImageData(w, h);
    var data = img.data;
    for (var i = 0; i < data.length; i += 4) {
      var v = (Math.random() * 256) | 0;
      data[i] = v;
      data[i + 1] = (Math.random() * 256) | 0;
      data[i + 2] = (Math.random() * 256) | 0;
      data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  window.__clearNoise = function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.display = "none";
  };

  document.addEventListener("keydown", function (e) {
    window.__lastKey = e.key;
    drawNoise();
  });

  document.addEventListener("click", function (e) {
    window.__lastClick = {
      x: e.clientX,
      y: e.clientY,
      id: (e.target && e.target.id) || ""
    };
  });

  document.addEventListener("visibilitychange", function () {
    window.__hidden = document.hidden;
  });

  // Steady requestAnimationFrame animation so the screencast emits frames.
  var track = document.getElementById("barTrack");
  var barEl = document.getElementById("bar");
  var pos = 0;
  var dir = 1;
  function tick() {
    var maxX = track.clientWidth - barEl.offsetWidth;
    pos += dir * 4;
    if (pos >= maxX) { pos = maxX; dir = -1; }
    else if (pos <= 0) { pos = 0; dir = 1; }
    barEl.style.transform = "translateX(" + pos + "px)";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
